{title:{fr:"Ch.1 — Le contrôle de gestion et le contexte de gestion",en:"Ch.1 — CDG and the Management Context"},
content:{
fr:`DÉFINITION : Le contrôle de gestion est un processus par lequel les dirigeants s'assurent que les ressources sont obtenues et utilisées avec efficacité (atteinte des objectifs) et efficience (optimisation des moyens).

ATTENTION : « Contrôle » ≠ vérification. Contrôler = maîtriser, piloter. Le CDG est un COPILOTE de la performance.

LE TRIANGLE DU CDG : 1. PRÉVOIR (budgets, plans, forecasts) — 2. MESURER (comptabilité analytique, coûts, reporting) — 3. AGIR (analyse des écarts, recommandations, actions correctives).

POSITIONNEMENT : Le CDG se situe entre le contrôle stratégique (DG, horizon 3-5 ans) et le contrôle opérationnel (terrain, quotidien). Il assure le lien stratégie → exécution.

LES CENTRES DE RESPONSABILITÉ :
• Centre de COÛTS : maîtrise des charges (ex : atelier production). Indicateur : coût unitaire.
• Centre de REVENUS : maîtrise du CA (ex : direction commerciale). Indicateur : CA, parts de marché.
• Centre de PROFIT : maîtrise CA + coûts (ex : boutique). Indicateur : marge, résultat.
• Centre d'INVESTISSEMENT : maîtrise CA + coûts + actifs (ex : filiale). Indicateur : ROI, EVA.

LA CHAÎNE DE VALEUR (Porter) : La valeur d'un produit ne vient pas que de la transformation. Elle découle de TOUTES les activités : logistique, production, marketing, service après-vente + activités de soutien (RH, R&D, infrastructure).

Le gestionnaire pilote le couple VALEUR-COÛT, pas seulement les coûts.

LE PROCESSUS BUDGÉTAIRE : Plan stratégique (3-5 ans) → Plan opérationnel (1 an) → Budgets mensuels → Reporting → Analyse des écarts → Actions correctives → Forecast révisé.

COMPÉTITIVITÉ = position concurrentielle forte par les prix ET par d'autres paramètres (qualité, délais, innovation, flexibilité).`,
en:`DEFINITION: Management control is a process by which managers ensure resources are obtained and used with effectiveness (achieving objectives) and efficiency (optimising means).

KEY: 'Control' ≠ checking. Control = mastery, steering. CDG is a COPILOT of performance.

THE CDG TRIANGLE: 1. FORECAST (budgets, plans) — 2. MEASURE (cost accounting, reporting) — 3. ACT (variance analysis, corrective actions).

POSITIONING: CDG sits between strategic control (Board, 3-5yr horizon) and operational control (shop floor, daily). It links strategy to execution.

RESPONSIBILITY CENTRES: Cost centres (control costs), Revenue centres (control sales), Profit centres (control both), Investment centres (control assets too — ROI, EVA).

VALUE CHAIN (Porter): Value comes from ALL activities, not just transformation. Managers steer the VALUE-COST couple.`
},
quiz:{q:{fr:"Quelle est la différence entre efficacité et efficience ?",en:"What is the difference between effectiveness and efficiency?"},
opts:{fr:["Aucune différence","Efficacité = atteindre les objectifs / Efficience = optimiser les moyens","Efficacité = réduire les coûts / Efficience = augmenter le CA","Efficience = atteindre les objectifs / Efficacité = optimiser les moyens"],
en:["No difference","Effectiveness = achieve objectives / Efficiency = optimise resources","Effectiveness = cut costs / Efficiency = grow revenue","Efficiency = achieve objectives / Effectiveness = optimise resources"]},
correct:1,
explanation:{fr:"Efficacité = atteindre les objectifs fixés. Efficience = les atteindre au moindre coût. Le CDG cherche les deux.",en:"Effectiveness = achieving set objectives. Efficiency = achieving them at minimum cost. CDG seeks both."}},

{title:{fr:"Pilotage et performance : le CDG en site industriel",en:"Performance Management: CDG in a Manufacturing Site"},
content:{
fr:`En site industriel, le CDG a 3 missions principales :

1. CLÔTURE MENSUELLE : J+2 Flash résultat, J+5 Pré-clôture, J+8 Clôture définitive. Tâches : correction pointages, synthèse performance site, consolidation reporting pôle.

2. CONTRÔLE INTERNE : Rapprochement 3 voies (BC/BL/Facture), inventaires physiques, cadre de contrôle Groupe.

3. PILOTAGE DES COÛTS : Suivi du coût unitaire vendable, analyse des écarts réel vs budget, amélioration reporting.

LE CUT-OFF : Cuir livré le 28/12, facturé le 05/01 → le coût appartient à DÉCEMBRE. Écriture : Débit 601 (Achats) / Crédit 4081 (FNP). Contre-passation en janvier. = Principe de spécialisation des exercices (PCG).

KPIs INDUSTRIELS :
• TRS (OEE) = Disponibilité × Performance × Qualité. Cible >85%.
• Taux de rejet : contrôle qualité exigeant.
• Coût unitaire vendable = Coût total / Unités CONFORMES au CQ.
  1 000 produits, 160 rejetés → Coût/u = 1M€ / 840 = 1 190€ (PAS 1M€/1000).`,
en:`In a manufacturing site, CDG has 3 key missions:

1. MONTHLY CLOSE: D+2 Flash, D+5 Pre-close, D+8 Final. Tasks: correct timesheets, build site performance summary, consolidate reporting.

2. INTERNAL CONTROL: Three-way matching (PO/delivery/invoice), physical counts, Group framework.

3. COST MANAGEMENT: Track cost per saleable unit, analyse actual vs budget, improve reporting.

CUT-OFF: Leather delivered 28/12, invoiced 05/01 → cost belongs to December. Entry: Debit 601 / Credit 4081 (FNP). Reversed in January.

KEY KPIs: OEE >85%. Cost per saleable unit = Total cost / Units PASSING QC.`
},

opts:{fr:["1 200€","1 429€","750€","1 500€"],en:["€1,200","€1,429","€750","€1,500"]},

{id:"cdg_couts",icon:"🧮",color:"#D4A017",term:0,title:{en:"Part 1 — Cost Analysis",fr:"Partie 1 — Analyse des Coûts"},lessons:[
{title:{fr:"Ch.2 — L'organisation et les coûts",en:"Ch.2 — Organisation and Costs"},
content:{
fr:`La comptabilité analytique (ou de gestion) est LIBRE — aucune obligation légale, contrairement à la comptabilité générale. Elle sert à calculer des COÛTS par produit, activité, fonction.

VOCABULAIRE FONDAMENTAL :
• CHARGE : consommation de ressources (≠ dépense qui est un flux de trésorerie)
• COÛT : accumulation de charges sur un objet de coût (produit, commande, activité)
• COÛT D'ACHAT = Prix d'achat + Frais d'approvisionnement
• COÛT DE PRODUCTION = Coût d'achat des matières consommées + Charges de production
• COÛT DE REVIENT = Coût de production + Charges de distribution + Charges d'administration

CHARGES DIRECTES vs INDIRECTES :
• Directes : affectables sans ambiguïté à un produit (matière première spécifique, MOD sur ce produit)
• Indirectes : communes à plusieurs produits → nécessitent une CLÉ DE RÉPARTITION (loyer, électricité, salaire du chef d'atelier)

CHARGES FIXES vs VARIABLES :
• Fixes : indépendantes du volume (loyer, amortissements, salaires cadres)
• Variables : proportionnelles au volume (matières premières, énergie, commissions)
• Semi-variables : partie fixe + partie variable (téléphone, entretien)

CHARGES INCORPORABLES : Toutes les charges de la comptabilité générale SAUF les charges non incorporables (exceptionnelles, provisions non justifiées). On AJOUTE les charges supplétives (rémunération des capitaux propres, rémunération de l'exploitant).

RÉSULTAT ANALYTIQUE = Résultat comptabilité générale + Charges supplétives - Charges non incorporables ± Différences d'incorporation.`,
en:`Cost accounting is FREE — no legal obligation unlike financial accounting. It calculates COSTS by product, activity, function.

KEY VOCABULARY:
• CHARGE: resource consumption (≠ cash payment)
• COST: accumulation of charges on a cost object
• PURCHASE COST = Purchase price + Procurement overheads
• PRODUCTION COST = Materials consumed + Production charges
• FULL COST = Production cost + Distribution + Administration

DIRECT vs INDIRECT: Direct = traceable to one product. Indirect = shared, needs allocation key.
FIXED vs VARIABLE: Fixed = independent of volume. Variable = proportional to volume.

INCORPORABLE CHARGES: All financial charges EXCEPT non-incorporable (exceptional). ADD notional charges (return on equity, entrepreneur's salary).`
},
quiz:{q:{fr:"Coût d'achat matières 50K€, charges production 30K€, distribution 10K€, administration 5K€. Coût de revient ?",en:"Purchase cost €50K, production €30K, distribution €10K, admin €5K. Full cost?"},
opts:{fr:["80 000€","90 000€","95 000€","85 000€"],en:["€80,000","€90,000","€95,000","€85,000"]},
correct:2,
explanation:{fr:"Coût de revient = 50K + 30K + 10K + 5K = 95 000€. Le coût de revient intègre TOUTES les charges jusqu'à la vente.",en:"Full cost = 50K + 30K + 10K + 5K = €95,000. Full cost includes ALL charges up to point of sale."}},

{title:{fr:"Ch.3 — Méthode des centres d'analyse",en:"Ch.3 — Cost Centre Method"},
content:{
fr:`LA méthode de référence du PCG. Alloue TOUTES les charges aux produits — directes et indirectes, fixes et variables.

ÉTAPES :
1. RÉPARTITION PRIMAIRE : Charges indirectes → centres d'analyse (Approvisionnement, Production, Distribution, Administration). Clés : m², effectifs, puissance installée...

2. RÉPARTITION SECONDAIRE : Centres auxiliaires (Entretien, RH, Informatique) → centres principaux. Méthodes : en escalier (pas de réciprocité) ou prestations réciproques (système d'équations).

3. CALCUL DU COÛT DE L'UNITÉ D'ŒUVRE (UO) :
   Coût UO = Total charges du centre ÷ Nombre d'UO
   UO courantes : heure machine, heure MOD, kg matière, € d'achat (taux de frais).

4. IMPUTATION AUX PRODUITS :
   Charges indirectes = Nb UO consommées × Coût UO

EXEMPLE : Charges indirectes atelier 800K€. UO = heure MOD. 5 000h/mois.
Coût UO = 800K / 5000 = 160€/h.
Produit A (18h MOD) : Indirect = 18 × 160 = 2 880€.
+ Cuir (directe) 1 200€ + MOD (directe) 18h × 45€ = 810€.
→ Coût de production complet = 4 890€.

PRESTATIONS RÉCIPROQUES : Si Entretien rend à Informatique et Informatique rend à Entretien :
E = charges propres E + 10% × I
I = charges propres I + 5% × E
→ Résoudre le système d'équations.

LIMITES : Clés de répartition subjectives. Charges fixes réparties par volume → distorsion. Ne distingue pas fixe/variable.`,
en:`THE reference PCG method. Allocates ALL costs to products.

STEPS: 1. Primary allocation (costs → centres via keys). 2. Secondary (auxiliary → main centres). 3. Cost per UO = Total / No. UO. 4. Imputation = UO consumed × Cost per UO.

RECIPROCAL SERVICES: If Maintenance serves IT and IT serves Maintenance → solve system of equations.

LIMITATIONS: Subjective allocation keys. Fixed costs spread by volume. No fixed/variable distinction.`
},
quiz:{q:{fr:"Charges indirectes 600K€, 4 000h MOD. Produit X : 15h MOD, matière 950€, MOD directe 45€/h. Coût complet ?",en:"Indirect €600K, 4,000h MOD. Product X: 15h, material €950, labour €45/h. Full cost?"},
opts:{fr:["3 875€","4 175€","3 200€","2 875€"],en:["€3,875","€4,175","€3,200","€2,875"]},
correct:0,
explanation:{fr:"UO = 600K/4000 = 150€/h. Indirect = 15×150 = 2 250€. Matière = 950€. MOD = 15×45 = 675€. Total = 3 875€.",en:"UO = €150/h. Indirect 15×150=€2,250. Material €950. Labour 15×45=€675. Total = €3,875."}},

{title:{fr:"Ch.4 — Le seuil de rentabilité",en:"Ch.4 — Break-Even Analysis"},
content:{
fr:`Le seuil de rentabilité (SR) est le CA pour lequel le résultat = 0. Au-delà → bénéfice. En-deçà → perte.

FORMULES CLÉS :
• Marge sur Coût Variable (MCV) = CA - Charges Variables
• Taux de MCV = MCV / CA
• SR en valeur = Charges Fixes / Taux de MCV
• SR en volume = Charges Fixes / MCV unitaire
• Point mort (en jours) = (SR / CA annuel) × 365

LEVIER OPÉRATIONNEL (LO) : Mesure la sensibilité du résultat à une variation du CA.
LO = MCV / Résultat = 1 / (1 - SR/CA)
Plus le SR est proche du CA → plus le LO est élevé → plus le risque est grand.

MARGE DE SÉCURITÉ = CA - SR. Indice de sécurité = Marge / CA.

EXEMPLE : CA = 180M€. CV = 72M€ (40%). MCV = 108M€. Taux MCV = 60%.
CF = 54M€. SR = 54M / 0,60 = 90M€.
Point mort = (90/180) × 365 = 182,5 jours → début juillet.
Marge de sécurité = 180 - 90 = 90M€ (50%). LO = 108/54 = 2.
→ Si CA +10% → Résultat +20%.

CAS PARTICULIER — SR avec charges fixes par paliers :
Si les CF augmentent au-delà d'un certain volume → plusieurs SR possibles. Raisonner par PALIER.

DÉCISION — Commande spéciale :
Si prix proposé > coût variable unitaire ET capacité disponible → ACCEPTER.
La commande contribue aux charges fixes déjà couvertes.`,
en:`Break-even point (BEP) = Revenue where profit = 0. Above → profit. Below → loss.

KEY FORMULAS: Contribution Margin (CM) = Revenue - Variable Costs. CM Ratio = CM/Revenue. BEP = Fixed Costs / CM Ratio.

OPERATING LEVERAGE: Sensitivity of profit to revenue change. OL = CM / Profit. Higher BEP relative to revenue = higher leverage = higher risk.

SAFETY MARGIN = Revenue - BEP.

SPECIAL ORDER DECISION: If price > variable cost per unit AND capacity available → ACCEPT.`
},
quiz:{q:{fr:"CA 200K€, CV 120K€, CF 50K€. Seuil de rentabilité ?",en:"Revenue €200K, VC €120K, FC €50K. Break-even point?"},
opts:{fr:["125 000€","150 000€","100 000€","170 000€"],en:["€125,000","€150,000","€100,000","€170,000"]},
correct:0,
explanation:{fr:"Taux MCV = (200-120)/200 = 40%. SR = 50K/0,40 = 125K€. Point mort = (125/200)×365 = 228 jours.",en:"CM ratio = 80/200 = 40%. BEP = 50K/0.40 = €125K. Break-even day = (125/200)×365 = day 228."}},
videos:[]},
{title:{fr:"Ch.5 — Les coûts partiels : variables ou directs",en:"Ch.5 — Partial Costs: Variable or Direct"},
content:{
fr:`POURQUOI DES COÛTS PARTIELS ? La méthode des coûts complets répartit TOUT → les charges fixes sont ventilées arbitrairement. Les coûts partiels ne retiennent QU'UNE PARTIE des charges.

DIRECT COSTING SIMPLE (Coût variable) :
Ne retient que les charges variables → MCV par produit.
Avantage : pas de répartition arbitraire des CF. Idéal pour les décisions court terme.

DIRECT COSTING ÉVOLUÉ (Coût spécifique) :
Retient charges variables + charges fixes DIRECTES (spécifiques) par produit.
Marge sur Coût Spécifique (MCS) = CA - CV - CF directes.
Les CF communes restent en bloc non réparti.
→ Si MCS < 0 → le produit ne couvre même pas ses propres CF → envisager abandon.
→ Si MCS > 0 mais résultat global négatif → le produit contribue, ne pas l'abandonner sans analyse.

TABLEAU TYPE :
                  Produit A    Produit B    TOTAL
CA                100 000      150 000      250 000
- CV              60 000       90 000       150 000
= MCV             40 000       60 000       100 000
- CF directes     25 000       35 000       60 000
= MCS             15 000       25 000       40 000
- CF communes                               30 000
= Résultat                                  10 000

DÉCISION ABANDON : Ne JAMAIS abandonner un produit à MCS positive. Les CF communes seraient reportées sur les autres produits.`,
en:`WHY PARTIAL COSTS? Full costing allocates everything → fixed costs spread arbitrarily. Partial costs retain only PART of the charges.

SIMPLE DIRECT COSTING (Variable costing): Only variable costs → Contribution Margin per product. Ideal for short-term decisions.

EVOLVED DIRECT COSTING (Specific costing): Variable + DIRECT fixed costs per product. Specific Margin (SM) = Revenue - VC - Direct FC.

DECISION: If SM > 0, the product contributes. NEVER abandon a product with positive SM without analysis.`
},
quiz:{q:{fr:"Produit X : CA 80K€, CV 50K€, CF directes 20K€. Faut-il l'abandonner ?",en:"Product X: Revenue €80K, VC €50K, Direct FC €20K. Should it be abandoned?"},
opts:{fr:["Oui, il est en perte","Non, MCS = 10K€ > 0, il contribue aux CF communes","Oui, la marge est trop faible","Impossible à déterminer"],
en:["Yes, it's loss-making","No, SM = €10K > 0, it contributes to common FC","Yes, margin too thin","Cannot determine"]},
correct:1,
explanation:{fr:"MCS = 80K - 50K - 20K = 10K€ > 0. Le produit contribue 10K€ aux CF communes. L'abandonner augmenterait la perte globale de 10K€.",en:"SM = 80-50-20 = €10K > 0. Abandoning it would increase overall loss by €10K."}},
videos:[]},
{title:{fr:"Ch.6 — Le coût marginal",en:"Ch.6 — Marginal Cost"},
content:{
fr:`Le coût marginal est le coût de la DERNIÈRE unité produite (ou du dernier lot).

DÉFINITION : Coût marginal = Variation du coût total / Variation de la quantité.
Cm = ΔCT / ΔQ

STRUCTURE :
- Si on reste dans la même structure → Cm = coût variable unitaire (les CF ne bougent pas)
- Si la production supplémentaire nécessite un investissement (nouvelle machine, heures sup) → Cm > CVu car il inclut le saut de CF

OPTIMUM ÉCONOMIQUE : Production optimale quand Cm = Recette marginale (Rm).
- Si Rm > Cm → continuer à produire (chaque unité supplémentaire augmente le profit)
- Si Rm < Cm → arrêter (chaque unité supplémentaire diminue le profit)

APPLICATIONS :
1. Accepter/refuser une commande supplémentaire à prix réduit
2. Sous-traiter ou produire en interne (make or buy)
3. Déterminer le volume optimal de production

EXEMPLE : Production actuelle 1 000 unités. CT = 80K€. Commande de 200 unités supplémentaires.
Nouveau CT = 92K€. Cm total = 92K - 80K = 12K€. Cm unitaire = 12K/200 = 60€.
Si prix de vente proposé = 70€ → Accepter (70 > 60, contribution de 10€/u).
Si prix de vente proposé = 55€ → Refuser (55 < 60, perte de 5€/u).

ATTENTION : Le coût marginal n'est pertinent que pour des décisions à COURT TERME et à CAPACITÉ donnée.`,
en:`Marginal cost = cost of the LAST unit produced (or last batch). Cm = ΔTotal Cost / ΔQuantity.

If within existing capacity → Cm = variable cost per unit. If new capacity needed → Cm includes the step in fixed costs.

ECONOMIC OPTIMUM: Optimal when Marginal Cost = Marginal Revenue.

APPLICATION: Accept order if selling price > marginal cost per unit.`
},
quiz:{q:{fr:"Production 1 000u, CT = 80K€. Commande 200u supplémentaires, nouveau CT = 92K€. Prix proposé 55€/u. Décision ?",en:"Output 1,000, TC=€80K. Extra order 200u, new TC=€92K. Price offered €55/u. Decision?"},
opts:{fr:["Accepter — tout revenu est bon","Refuser — Cm = 60€ > 55€","Accepter — Cm = 50€ < 55€","Négocier à 60€"],
en:["Accept — all revenue is good","Refuse — Cm=€60 > €55","Accept — Cm=€50 < €55","Negotiate to €60"]},
correct:1,
explanation:{fr:"Cm = (92K-80K)/200 = 60€. Prix proposé 55€ < 60€ → perte de 5€ par unité → REFUSER.",en:"Cm = (92-80K)/200 = €60. Price €55 < €60 → loss of €5 per unit → REFUSE."}},
videos:[]},
{title:{fr:"Ch.7 — L'imputation rationnelle des charges fixes",en:"Ch.7 — Rational Allocation of Fixed Costs"},
content:{
fr:`PROBLÈME : En coûts complets, quand l'activité baisse, le coût unitaire AUGMENTE (les CF se répartissent sur moins d'unités). C'est trompeur — le produit n'est pas devenu plus cher à fabriquer.

PRINCIPE DE L'IMPUTATION RATIONNELLE :
On n'impute aux coûts que la part des CF correspondant à l'activité NORMALE.

Coefficient d'Imputation Rationnelle (CIR) = Activité Réelle / Activité Normale

CF imputées = CF totales × CIR

Si CIR > 1 (suractivité) → on impute PLUS que les CF réelles → boni de suractivité
Si CIR < 1 (sous-activité) → on impute MOINS → mali (coût) de sous-activité
Si CIR = 1 → imputation = CF réelles

EXEMPLE :
Activité normale = 1 000 unités. CF = 100K€. CV unitaire = 50€.
Mois 1 : Production réelle = 800u. CIR = 800/1000 = 0,80.
CF imputées = 100K × 0,80 = 80K€. Mali = 20K€ (coût de sous-activité).
Coût unitaire = 50 + (80K/800) = 50 + 100 = 150€ (stable !)
Sans IR : Coût unitaire = 50 + (100K/800) = 50 + 125 = 175€ (faussement élevé).

INTÉRÊT : Permet de comparer les coûts entre périodes en neutralisant l'effet volume sur les CF. Indispensable pour les décisions de prix.`,
en:`PROBLEM: In full costing, when activity drops, unit cost rises (FC spread over fewer units). Misleading.

RATIONAL ALLOCATION: Only allocate the FC proportion corresponding to NORMAL activity.

Coefficient = Actual Activity / Normal Activity. FC allocated = Total FC × Coefficient.

If >1 (over-activity) → bonus. If <1 (under-activity) → cost of idle capacity.

BENEFIT: Comparable costs between periods regardless of volume fluctuations.`
},
quiz:{q:{fr:"Activité normale 1 000u, CF 100K€, activité réelle 800u. Mali de sous-activité ?",en:"Normal 1,000u, FC €100K, actual 800u. Under-activity cost?"},
opts:{fr:["0€","20 000€","25 000€","80 000€"],en:["€0","€20,000","€25,000","€80,000"]},
correct:1,
explanation:{fr:"CIR = 800/1000 = 0,80. CF imputées = 100K × 0,80 = 80K€. Mali = 100K - 80K = 20K€. C'est le coût de la capacité inutilisée.",en:"CIR = 0.80. FC allocated = €80K. Under-activity cost = 100K - 80K = €20K."}},
videos:[]},
{title:{fr:"Ch.3bis — Méthode ABC (Activity-Based Costing)",en:"Ch.3bis — ABC Method (Activity-Based Costing)"},
content:{
fr:`La méthode ABC corrige les distorsions des centres d'analyse. Les produits consomment des ACTIVITÉS, les activités consomment des RESSOURCES.

VOCABULAIRE :
• Activité : ensemble de tâches homogènes (réceptionner, contrôler qualité, lancer un OF)
• Inducteur de coût : facteur déclencheur du coût (nb de réceptions, nb contrôles, nb OF)
• Coût unitaire inducteur = Coût activité / Volume inducteur

ÉTAPES ABC :
1. Identifier les activités significatives
2. Affecter les ressources aux activités
3. Définir l'inducteur de chaque activité
4. Calculer le coût unitaire par inducteur
5. Imputer aux produits selon leur consommation d'inducteurs

DIFFÉRENCE CLÉ : Centres d'analyse = coûts par LIEUX. ABC = coûts par PROCESSUS.

EXEMPLE : Activité Contrôle Qualité : 240K€/mois. Inducteur = nb contrôles.
Produit A : 1 contrôle/lot de 10. Production 500 → 50 contrôles.
Produit B : 1 contrôle/lot de 100. Production 5 000 → 50 contrôles.
Coût CQ par contrôle = 240K/100 = 2 400€.
Produit A : 50 × 2 400 = 120K€ → 240€/unité.
Produit B : 50 × 2 400 = 120K€ → 24€/unité.

Avec centres d'analyse (UO = heure MOD), le produit B absorberait quasi tout. ABC rétablit la vérité.

QUAND UTILISER ABC : Charges indirectes > 30% du coût total. Produits très diversifiés. Volumes très différents.`,
en:`ABC corrects cost centre distortions. Products consume ACTIVITIES, activities consume RESOURCES.

KEY: Cost centres route costs through PLACES. ABC routes through PROCESSES.

WHEN TO USE: Indirect >30% of total. Diverse products. Very different volumes.`
},
quiz:{q:{fr:"Activité Lancement OF : 180K€, 600 OF. Produit A = 1 OF/10 unités (500u), Produit B = 1 OF/100 unités (5 000u). Coût lancement par unité ?",en:"Launch PO: €180K, 600 POs. Product A: 1 PO/10 units (500u), B: 1 PO/100 (5,000u). Launch cost per unit?"},
opts:{fr:["A=300€, B=3€","A=30€, B=30€","A=15€, B=15€","A=360€, B=36€"],en:["A=€300, B=€3","A=€30, B=€30","A=€15, B=€15","A=€360, B=€36"]},
correct:0,
explanation:{fr:"A: 500/10 = 50 OF. B: 5000/100 = 50 OF. Coût/OF = 180K/100 = 1 800€. A: 50×1800/500 = 180€. Hmm recalculons. 180K/600 = 300€/OF. A: 50 OF × 300 = 15K → 15K/500 = 30€/u. B: 50 OF × 300 = 15K → 15K/5000 = 3€/u.",en:"Cost/PO = €180K/600 = €300. A: 50 POs, B: 50 POs. A: 50×300/500=€30/u. B: 50×300/5000=€3/u."}},
videos:[]}
]},
{id:"cdg_budget",icon:"📉",color:"#C62828",term:0,title:{en:"Part 2 — Budgetary Management",fr:"Partie 2 — Gestion Budgétaire"},lessons:[
{title:{fr:"Ch.8 — L'organisation et les budgets",en:"Ch.8 — Organisation and Budgets"},
content:{
fr:`Le BUDGET est l'expression chiffrée des objectifs et des moyens pour une période donnée (généralement 1 an, découpé en mois).

HIÉRARCHIE : Plan stratégique (3-5 ans) → Plan opérationnel (1 an) → BUDGETS (mensuels).

TYPES DE BUDGETS :
1. Budget des VENTES (point de départ — détermine tout le reste)
2. Budget de PRODUCTION (découle des ventes + politique de stock)
3. Budget des APPROVISIONNEMENTS (découle de la production)
4. Budget de la MASSE SALARIALE
5. Budget des INVESTISSEMENTS
6. Budget de TRÉSORERIE (synthèse de tous les autres)
7. Documents de synthèse prévisionnels (bilan, compte de résultat)

ARTICULATION : Ventes → Production → Approvisionnements → Trésorerie. C'est un enchaînement LOGIQUE.

CENTRES DE RESPONSABILITÉ ET BUDGETS :
Chaque centre a un budget = un engagement sur des objectifs mesurables.
Le budget est un CONTRAT entre le responsable et sa hiérarchie.

BUDGETS DISCRÉTIONNAIRES : Pour les fonctions support (RH, R&D, marketing) où le lien input/output n'est pas direct. On fixe une ENVELOPPE et on évalue la QUALITÉ du service rendu.

BBZ (Budget Base Zéro) : Chaque année, justifier CHAQUE dépense à partir de zéro. Pas de reconduction automatique. Lourd mais efficace pour éliminer les dépenses inertielles.`,
en:`A BUDGET is the quantified expression of objectives and means for a given period (usually 1 year, broken into months).

HIERARCHY: Strategic plan → Operational plan → BUDGETS.

TYPES: Sales (starting point) → Production → Procurement → Payroll → Investment → Cash → Pro forma statements.

DISCRETIONARY BUDGETS: For support functions where input/output link isn't direct. Set an ENVELOPE, evaluate quality.

ZBB (Zero-Based Budgeting): Justify EVERY expense from zero each year. No automatic rollover.`
},
quiz:{q:{fr:"Quel budget est le point de départ de tout le processus budgétaire ?",en:"Which budget is the starting point of the entire budgetary process?"},
opts:{fr:["Budget de trésorerie","Budget de production","Budget des ventes","Budget des investissements"],en:["Cash budget","Production budget","Sales budget","Investment budget"]},
correct:2,
explanation:{fr:"Le budget des ventes est TOUJOURS le point de départ. La production découle des ventes, les approvisionnements de la production, la trésorerie de tout le reste.",en:"Sales budget is ALWAYS the starting point. Production follows sales, procurement follows production, cash follows everything."}},
videos:[]},
{title:{fr:"Ch.9 — Les outils pour préparer les budgets",en:"Ch.9 — Tools for Budget Preparation"},
content:{
fr:`PRÉVISION DES VENTES — Méthodes quantitatives :

1. MOINDRES CARRÉS (régression linéaire) : y = ax + b
   a = (n×Σxy - Σx×Σy) / (n×Σx² - (Σx)²)
   b = ȳ - a×x̄
   Permet d'extrapoler une tendance.

2. MOYENNES MOBILES : Lisser les variations saisonnières.
   MM d'ordre p = moyenne des p dernières observations.
   Si p = 4 (trimestriel) → MM centrée.

3. COEFFICIENTS SAISONNIERS :
   Cs = Valeur réelle / Valeur tendancielle (ou MM)
   Prévision = Tendance × Coefficient saisonnier

4. LISSAGE EXPONENTIEL : Pt+1 = α × Rt + (1-α) × Pt
   α entre 0 et 1. Plus α est élevé, plus on pondère le récent.

EXEMPLE : Tendance Y = 100 + 5t. Coefficient T3 = 1,25.
Prévision T3 année 5 (t=19) : Y = 100 + 5×19 = 195. Avec saisonnalité : 195 × 1,25 = 243,75.

LOI NORMALE ET PROBABILITÉS :
Pour les prévisions en avenir incertain. Variable centrée réduite : Z = (X - μ) / σ.
P(X > seuil) → lire dans la table de la loi normale.

ÉLASTICITÉ : e = (ΔQ/Q) / (ΔP/P). Si e = -2, une hausse de prix de 10% → baisse des ventes de 20%.`,
en:`SALES FORECASTING — Quantitative methods:

1. LEAST SQUARES (linear regression): y = ax + b. Extrapolate a trend.
2. MOVING AVERAGES: Smooth seasonal variations.
3. SEASONAL COEFFICIENTS: Cs = Actual / Trend. Forecast = Trend × Cs.
4. EXPONENTIAL SMOOTHING: Pt+1 = α×Rt + (1-α)×Pt.

NORMAL DISTRIBUTION: For uncertain forecasts. Z = (X-μ)/σ.
ELASTICITY: e = (%ΔQ)/(%ΔP). If e=-2, 10% price rise → 20% volume drop.`
},
quiz:{q:{fr:"Tendance Y = 200 + 10t. Coefficient saisonnier T2 = 0,85. Prévision T2 année 4 (t=14) ?",en:"Trend Y=200+10t. Seasonal coeff Q2=0.85. Forecast Q2 year 4 (t=14)?"},
opts:{fr:["340","289","400","380"],en:["340","289","400","380"]},
correct:1,
explanation:{fr:"Y = 200 + 10×14 = 340. Avec saisonnalité : 340 × 0,85 = 289.",en:"Y = 200 + 10×14 = 340. Seasonally adjusted: 340 × 0.85 = 289."}},
videos:[]},
{title:{fr:"Ch.10 — Les budgets opérationnels",en:"Ch.10 — Operational Budgets"},
content:{
fr:`BUDGET DES VENTES :
Quantités prévisionnelles × Prix unitaire. Ventilé par produit, zone géo, vendeur, mois.
Intègre les coefficients saisonniers.

BUDGET DE PRODUCTION :
Production = Ventes + Stock final souhaité - Stock initial.
Sous contrainte de capacité. Si insuffisante → heures sup, sous-traitance, investissement.
Programmation linéaire si plusieurs produits et contraintes multiples :
Max Z = marge A × QA + marge B × QB sous contraintes de capacité.

BUDGET DES APPROVISIONNEMENTS :
Quand et combien commander ? → Modèle de WILSON.
Coût total = Coût d'achat + Coût de passation + Coût de stockage.
Quantité Économique de Commande (QEC) : Q* = √(2×D×Cp / Cs)
D = demande annuelle, Cp = coût de passation d'une commande, Cs = coût de stockage unitaire annuel.
Nombre optimal de commandes : N* = D / Q*

STOCK DE SÉCURITÉ : Pour se protéger contre les aléas (retard fournisseur, pic de demande).
SS = Consommation max pendant délai - Consommation moyenne pendant délai.

BUDGET DE LA MASSE SALARIALE (Ch.9 Vuibert) :
Effet GVT : Glissement (ancienneté) + Vieillissement (pyramide) + Technicité (qualification).
Effet NORIA : Remplacement de salariés expérimentés par des juniors → baisse du coût moyen.
Effet EFFECTIF : Variation du nombre de salariés.
Masse salariale N+1 = MS N × (1 + effet en niveau) × (1 + effet en masse) × (1 + effet effectif).`,
en:`SALES BUDGET: Forecast quantities × Unit price. By product, geography, month.

PRODUCTION BUDGET: Production = Sales + Target closing stock - Opening stock. Subject to capacity constraints. Linear programming if multiple products.

PROCUREMENT BUDGET — WILSON MODEL:
EOQ: Q* = √(2×D×Co/Cs). D=annual demand, Co=order cost, Cs=holding cost per unit/year.

PAYROLL BUDGET — GVT EFFECT: Seniority drift + Age structure + Skill mix. NORIA effect: replacing experienced with junior = lower average cost.`
},
quiz:{q:{fr:"Demande annuelle 12 000u. Coût passation 200€/commande. Coût stockage 6€/u/an. QEC ?",en:"Annual demand 12,000. Order cost €200. Holding cost €6/u/year. EOQ?"},
opts:{fr:["894 unités","632 unités","1 000 unités","400 unités"],en:["894 units","632 units","1,000 units","400 units"]},
correct:0,
explanation:{fr:"Q* = √(2 × 12000 × 200 / 6) = √800000 = 894 unités. N* = 12000/894 ≈ 13,4 commandes/an.",en:"Q* = √(2×12000×200/6) = √800,000 = 894 units."}},
videos:[]},
{title:{fr:"Ch.11 — Budgets financiers et documents de synthèse",en:"Ch.11 — Financial Budgets and Pro Forma Statements"},
content:{
fr:`BUDGET DE TRÉSORERIE :
Synthèse de TOUS les autres budgets, traduits en encaissements et décaissements.

Trésorerie fin de mois = Trésorerie début + Encaissements - Décaissements

ENCAISSEMENTS : Ventes TTC (en tenant compte des délais de paiement clients).
Ex : 30% comptant, 40% à 30j, 30% à 60j.
DÉCAISSEMENTS : Achats TTC (délai fournisseurs), salaires, charges sociales, investissements, impôts, dividendes.

ATTENTION : La TVA est un flux de trésorerie !
TVA collectée (sur ventes) - TVA déductible (sur achats/investissements) = TVA à décaisser (le 15-25 du mois suivant).

BUDGET DE TVA :
TVA collectée M - TVA déductible M = TVA nette. Si positive → à payer M+1. Si négative → crédit de TVA reportable.

DOCUMENTS DE SYNTHÈSE PRÉVISIONNELS :
1. Compte de résultat prévisionnel (agrège tous les budgets opérationnels)
2. Bilan prévisionnel (intègre les variations de stocks, créances, dettes, investissements)
3. Plan de financement (vérifie l'équilibre financier à moyen terme)

Si le budget de trésorerie montre un DÉFICIT → solutions :
- Escompte d'effets, affacturage, facilité de caisse
- Décaler des investissements
- Négocier des délais fournisseurs plus longs

Si EXCÉDENT → placements court terme.`,
en:`CASH BUDGET: Synthesis of ALL other budgets, translated into receipts and payments.

End cash = Opening + Receipts - Payments.

RECEIPTS: Sales incl. VAT (adjusted for payment delays). PAYMENTS: Purchases incl. VAT, salaries, social charges, investments, taxes.

VAT BUDGET: Collected - Deductible = Net payable (following month).

PRO FORMA STATEMENTS: P&L, Balance Sheet, Financing Plan.

DEFICIT → discounting, factoring, delay investments. SURPLUS → short-term investments.`
},

{title:{fr:"Ch.12 — Contrôle budgétaire du résultat",en:"Ch.12 — Budgetary Control of Profit"},
content:{
fr:`Le contrôle budgétaire compare le RÉEL au PRÉVU et décompose les écarts.

ÉCART GLOBAL SUR RÉSULTAT = Résultat réel - Résultat budgété.

DÉCOMPOSITION EN ÉCARTS SUR CHARGES DIRECTES :
Écart sur matières :
• Écart sur QUANTITÉ = (Qr - Qp) × Pp (a-t-on consommé plus ?)
• Écart sur PRIX = (Pr - Pp) × Qr (a-t-on payé plus cher ?)
• Écart total = Écart quantité + Écart prix

Écart sur MOD :
• Écart sur TEMPS = (Hr - Hp) × Tp (a-t-on mis plus de temps ?)
• Écart sur TAUX = (Tr - Tp) × Hr (le taux horaire a-t-il augmenté ?)

Conventions : Favorable (F) si réel < prévu. Défavorable (D) si réel > prévu.

EXEMPLE — Matières :
Budget : 1 000u × 2kg × 15€/kg = 30 000€.
Réel : 1 030u produites, 2 100kg à 15,08€/kg = 31 668€.
Qp ajustée = 1 030 × 2 = 2 060kg.
É/quantité = (2100 - 2060) × 15 = 600€ D.
É/prix = (15,08 - 15) × 2100 = 168€ D.
Écart total = 768€ D ✓ (31 668 - 30 900 budget ajusté).

ÉCARTS SUR CHARGES INDIRECTES — 3 SOUS-ÉCARTS :
Budget flexible = (CV/UO × AR) + CF.
1. É/BUDGET = Réel - Budget flexible(AR) → a-t-on trop dépensé ?
2. É/ACTIVITÉ = BF(AR) - CSUO×AR → sur/sous-absorption des CF
3. É/RENDEMENT = CSUO×AR - CSUO×(std×prod réelle) → efficacité

ÉCART SUR CA :
É/prix = (Prix réel - Prix budgété) × Qté réelle
É/volume = (Qté réelle - Qté budgétée) × Prix budgété
É/mix = si plusieurs produits, décomposer l'effet composition.`,
en:`Budgetary control compares ACTUAL to FORECAST and decomposes variances.

DIRECT COST VARIANCES:
Materials: Quantity variance = (Qa-Qs)×Sp. Price variance = (Pa-Sp)×Qa.
Labour: Efficiency = (Ha-Hs)×Sr. Rate = (Ra-Sr)×Ha.

INDIRECT COST VARIANCES — 3 sub-variances:
1. Spending = Actual - Flex budget. 2. Volume = Flex budget - Std cost of actual. 3. Efficiency.

REVENUE VARIANCES: Price, Volume, Mix.`
},
quiz:{q:{fr:"Budget : 500u × 3kg × 10€ = 15K€. Réel : 520u, 1 600kg, 10,50€/kg. Écart sur prix ?",en:"Budget: 500u×3kg×€10=€15K. Actual: 520u, 1,600kg, €10.50/kg. Price variance?"},

correct:0,
explanation:{fr:"É/prix = (10,50 - 10) × 1 600 = 800€ Défavorable. On a payé 0,50€ de plus par kg sur 1 600kg.",en:"Price variance = (10.50-10)×1,600 = €800 Unfavourable."}},

]},
{id:"cdg_pilotage",icon:"📊",color:"#2E86AB",term:0,title:{en:"Part 3 — Performance Management",fr:"Partie 3 — Pilotage de la Performance"},lessons:[
{title:{fr:"Ch.13 — L'organisation et la performance",en:"Ch.13 — Organisation and Performance"},
content:{
fr:`LA PERFORMANCE est multidimensionnelle : financière, commerciale, sociale, environnementale.

MESURES DE PERFORMANCE :
• ROI (Return on Investment) = Résultat / Capitaux investis
• EVA (Economic Value Added) = Résultat opérationnel - (CMPC × Capitaux engagés)
  Si EVA > 0 → création de valeur. Si EVA < 0 → destruction de valeur.
• BSC (Balanced Scorecard) — Kaplan & Norton : 4 perspectives :
  1. FINANCIÈRE : ROI, EVA, croissance CA
  2. CLIENTS : satisfaction, fidélisation, part de marché
  3. PROCESSUS INTERNES : qualité, délais, productivité
  4. APPRENTISSAGE : compétences, innovation, climat social

PRIX DE CESSION INTERNE (PCI) :
Quand des divisions s'échangent des biens/services → quel prix interne ?
• PCI au coût complet : simple mais tue l'incitation du vendeur
• PCI au coût + marge : simule un marché
• PCI au prix de marché : idéal si marché externe existe
• PCI négocié : compromis entre divisions
Critères : congruence (intérêt division = intérêt groupe), autonomie, équité.

GOUVERNANCE BUDGÉTAIRE :
• Budget imposé (top-down) : rapide mais peu mobilisateur
• Budget négocié (bottom-up) : plus lent mais meilleure adhésion
• Budget itératif (navette) : DG fixe le cadre, opérationnels proposent, allers-retours
→ Le budget itératif est la meilleure pratique.`,
en:`PERFORMANCE is multidimensional: financial, commercial, social, environmental.

MEASURES: ROI = Profit/Capital. EVA = Operating profit - (WACC × Capital employed). BSC (Kaplan & Norton): 4 perspectives — Financial, Customer, Internal Process, Learning & Growth.

TRANSFER PRICING: At full cost, cost-plus, market price, or negotiated. Criteria: goal congruence, autonomy, fairness.

BUDGET GOVERNANCE: Top-down (imposed), bottom-up (participative), or iterative (best practice).`
},
quiz:{q:{fr:"Résultat opérationnel 500K€, capitaux engagés 4M€, CMPC 8%. EVA ?",en:"Operating profit €500K, capital €4M, WACC 8%. EVA?"},
opts:{fr:["180 000€","500 000€","320 000€","-180 000€"],en:["€180,000","€500,000","€320,000","-€180,000"]},
correct:0,
explanation:{fr:"EVA = 500K - (8% × 4M) = 500K - 320K = 180K€. Positif → création de valeur.",en:"EVA = 500K - (8%×4M) = 500K - 320K = €180K. Positive → value creation."}},

{title:{fr:"Ch.14 — Le pilotage de la qualité",en:"Ch.14 — Quality Management"},
content:{
fr:`LA QUALITÉ : Aptitude d'un produit/service à satisfaire les besoins des utilisateurs (norme ISO).

COÛTS DE LA QUALITÉ (COQ) — 4 catégories :
1. Coûts de PRÉVENTION : formation, procédures, maintenance préventive
2. Coûts de DÉTECTION (évaluation) : contrôles, tests, inspections, audits
3. Coûts de DÉFAILLANCE INTERNE : rebuts, retouches, temps perdu
4. Coûts de DÉFAILLANCE EXTERNE : SAV, garanties, réclamations, perte de clients

OPTIMUM QUALITÉ : Minimiser le COQ total = (Prévention + Détection) + (Défaillances).
Plus on investit en prévention/détection → moins de défaillances. Mais au-delà d'un seuil → surcoût.

COÛTS CACHÉS (méthode ISEOR) :
Dysfonctionnements → coûts invisibles : absentéisme, rotation du personnel, non-qualité, sous-productivité.
Se calculent par les SURTEMPS (heures perdues) et les SURCOÛTS (consommations excessives).

OUTILS QUALITÉ :
• Diagramme de PARETO (80/20) : 20% des causes = 80% des défauts
• Diagramme d'ISHIKAWA (5M) : Matière, Méthode, Main-d'œuvre, Milieu, Matériel
• Carte de CONTRÔLE : Suivi statistique. Si point hors limites → processus déréglé
• CONTRÔLE STATISTIQUE : Loi normale, échantillonnage, intervalles de confiance

LOI NORMALE : 68% dans [μ±σ], 95% dans [μ±2σ], 99,7% dans [μ±3σ].
Si poids nominal 250g, σ = 5g → 95% entre 240-260g.`,
en:`QUALITY: Fitness for purpose (ISO). Cost of Quality (COQ): Prevention + Detection + Internal failures + External failures.

OPTIMUM: Minimise total COQ. More prevention → fewer failures, but beyond a threshold → over-investment.

HIDDEN COSTS (ISEOR method): Absenteeism, turnover, non-quality, under-productivity.

TOOLS: Pareto (80/20), Ishikawa (5M), Control charts, Statistical process control.
Normal distribution: 68% within ±1σ, 95% within ±2σ, 99.7% within ±3σ.`
},
quiz:{q:{fr:"Prévention 50K€, détection 30K€, défaillances internes 80K€, externes 40K€. COQ total et répartition ?",en:"Prevention €50K, detection €30K, internal failures €80K, external €40K. Total COQ?"},
opts:{fr:["200K€ — sous-investissement en prévention","200K€ — trop de détection","200K€ — équilibre parfait","120K€"],en:["€200K — under-investment in prevention","€200K — too much detection","€200K — perfect balance","€120K"]},
correct:0,
explanation:{fr:"COQ = 50+30+80+40 = 200K€. Défaillances (120K) > Conformité (80K) → sous-investissement en prévention. Il faut augmenter prévention pour réduire les défaillances.",en:"COQ = €200K. Failures (€120K) > Conformance (€80K) → under-investing in prevention."}},

{title:{fr:"Ch.15 — Le pilotage des ressources humaines",en:"Ch.15 — HR Performance Management"},
content:{
fr:`MASSE SALARIALE ET ÉCARTS :
La masse salariale (MS) est souvent le premier poste de charge (30-70% du CA selon le secteur).

ÉCARTS SUR MASSE SALARIALE :
É/effectif = (Effectif réel - Effectif prévu) × Salaire moyen prévu
É/salaire = (Salaire moyen réel - Salaire moyen prévu) × Effectif réel

EFFETS SUR L'ÉVOLUTION DE LA MS :
• Effet en NIVEAU : impact d'une augmentation sur le salaire mensuel
• Effet en MASSE : impact sur la MS annuelle (dépend de la date d'application)
  Augmentation de 3% au 01/07 → effet en masse = 3% × 6/12 = 1,5%
• Effet REPORT : impact sur l'année suivante des augmentations de l'année en cours
  Si +3% au 01/07 de N → effet report sur N+1 = 3% × 6/12 = 1,5% (les 6 mois non complets)

EFFET GVT :
G = Glissement : progression à l'ancienneté
V = Vieillissement : évolution de la pyramide des âges
T = Technicité : montée en qualification

EFFET NORIA : Remplacement de seniors (salaire élevé) par des juniors (salaire bas) → baisse du coût moyen. Peut masquer des augmentations individuelles.

INDICATEURS RH :
• Taux d'absentéisme = Jours absence / Jours théoriques
• Taux de rotation (turnover) = Départs / Effectif moyen
• Productivité = Production / Effectif (ou heures travaillées)
• Ratio encadrement = Cadres / Effectif total`,
en:`PAYROLL is often the largest cost (30-70% of revenue).

VARIANCES: Headcount = (Actual-Budget heads) × Budget avg salary. Salary = (Actual-Budget avg salary) × Actual heads.

GVT EFFECT: Seniority drift + Age pyramid + Skill progression.
NORIA: Replacing seniors with juniors → lower average cost.

LEVEL EFFECT: Impact of a raise on monthly salary.
MASS EFFECT: Impact on annual payroll (depends on implementation date). +3% from July 1 → mass effect = 1.5%.
CARRYOVER: Impact on following year.

HR KPIs: Absenteeism rate, Turnover, Productivity, Management ratio.`
},
quiz:{q:{fr:"MS budgétée 1,2M€ pour 30 salariés. Réel : 32 salariés, salaire moyen 38K€ vs 40K€ budget. Écart effectif ?",en:"Budget payroll €1.2M for 30 staff. Actual: 32 staff, avg salary €38K vs €40K budget. Headcount variance?"},

correct:0,
explanation:{fr:"É/effectif = (32-30) × 40K = 80K€ Défavorable. 2 salariés de plus que prévu au salaire moyen budgété.",en:"Headcount variance = (32-30) × €40K = €80K Unfavourable."}},

{title:{fr:"Le Tableau de Bord — Méthode OVAR",en:"Tableau de Bord — OVAR Method"},
content:{
fr:`Le TdB est un outil de PILOTAGE (décision + action), pas un simple reporting.

MÉTHODE OVAR : O=Objectifs, V=Variables d'action, A=plans d'Action, R=Responsabilités.
Pour chaque objectif → identifier les variables d'action → définir des indicateurs.

RÈGLES D'OR : Max 10-15 indicateurs. Fréquence adaptée. Comparaison avec objectif, N-1, benchmark.

3 TYPES D'INDICATEURS :
• Indicateurs de RÉSULTAT : mesurent l'atteinte de l'objectif (CA, marge, taux de rejet)
• Indicateurs de MOYEN : mesurent les ressources mobilisées (heures formation, budget pub)
• Indicateurs de PROCESSUS : mesurent l'efficacité du processus (délai moyen, taux de service)

TdB vs REPORTING :
• TdB : synthétique, ciblé, pour l'ACTION. Destiné au responsable opérationnel.
• Reporting : exhaustif, détaillé, pour rendre COMPTE. Destiné à la hiérarchie.

BALANCED SCORECARD (Kaplan & Norton) :
4 axes liés par des relations de cause à effet :
Apprentissage → Processus → Clients → Finance
Exemple : Former les artisans (apprentissage) → Réduire les défauts (processus) → Améliorer satisfaction client → Augmenter la marge (finance).

COÛT CIBLE (Target Costing) :
Prix de vente cible - Marge cible = COÛT CIBLE.
On part du marché (prix acceptable) et on remonte vers la conception.
Si coût estimé > coût cible → ANALYSE DE LA VALEUR pour réduire les coûts sans réduire la valeur perçue.`,
en:`TdB is for STEERING (decision + action), not just reporting.

OVAR METHOD: Objectives → Action Variables → Action plans → Responsibilities. Max 10-15 indicators.

3 INDICATOR TYPES: Result (measure achievement), Means (resources used), Process (efficiency).

TdB vs Reporting: TdB = synthetic, for action. Reporting = exhaustive, for accountability.

BALANCED SCORECARD: Learning → Process → Customer → Financial (cause-effect chain).

TARGET COSTING: Target price - Target margin = TARGET COST. If estimated > target → VALUE ANALYSIS.`
},

Golden rule: Net income \u{2260} Cash flow.`},quiz:{q:{fr:"Hermès : 70% MB, 40% EBIT. L'écart de 30 points représente ?",en:"Hermès: 70% GM, 40% EBIT. The 30pt gap represents?"},opts:{fr:["Inefficacité","OpEx (boutiques, artisans, marketing) — mais 40% EBIT reste exceptionnel","COGS trop élevé","Réduire les coûts"],en:["Inefficiency","OpEx (boutiques, artisans, marketing) — but 40% EBIT is extraordinary","COGS too high","Cut costs"]},correct:1,explanation:{fr:"40% EBIT vs LVMH ~26%, Kering ~25%. Pricing power + zéro discount + intégration verticale.",en:"40% EBIT vs LVMH ~26%, Kering ~25%. Pricing power + zero discounting + vertical integration."}},videos:[]}]},{id:"finance",icon:"💰",color:"#A23B72",term:1,title:{en:"Applied Managerial Finance",fr:"Finance Managériale"},lessons:[{title:{en:"TVM & DCF Valuation",fr:"Valeur Temps & Évaluation DCF"},content:{fr:`VA = VF/(1+r)^n. VAN = \u{3A3} flux actualis\xe9s - Investissement. TRI = taux o\xf9 VAN = 0.
DCF : FCF 5-10 ans \u{2192} VT = FCF\xd7(1+g)/(CMPC-g) \u{2192} Actualiser au CMPC.
Herm\xe8s : EV/EBITDA ~35-40\xd7 vs luxe ~15-20\xd7.`,en:`PV = FV/(1+r)^n. NPV = \u{3A3} discounted flows - Investment. IRR = rate where NPV = 0.
DCF: FCF 5-10 yrs \u{2192} TV = FCF\xd7(1+g)/(WACC-g) \u{2192} Discount at WACC.
Herm\xe8s: EV/EBITDA ~35-40\xd7 vs luxury ~15-20\xd7.`},quiz:{q:{fr:"FCF 3Mds€, g=3%, CMPC=7%. Valeur terminale ?",en:"FCF €3B, g=3%, WACC=7%. Terminal value?"},opts:{fr:["42,9 Mds€","75 Mds€","77,25 Mds€","100 Mds€"],en:["€42.9B","€75B","€77.25B","€100B"]},correct:2,explanation:{fr:"VT = 3×1,03/0,04 = 77,25 Mds€. Si g=4%, VT = 104 Mds€. Sensibilité extrême.",en:"TV = 3×1.03/0.04 = €77.25B. If g=4%, TV = €104B. Extreme sensitivity."}},videos:[]}]},{id:"excel",icon:"📊",color:"#217346",term:3,title:{en:"Advanced Excel for Finance",fr:"Excel Avancé Finance"},lessons:[{title:{fr:"INDEX/EQUIV & RECHERCHEX",en:"INDEX/MATCH & XLOOKUP"},content:{fr:`INDEX/EQUIV remplace RECHERCHEV \u{2014} bidirectionnel et incassable.
=INDEX(plage_retour; EQUIV(valeur; plage_rech; 0))
RECHERCHEX (365) : =RECHERCHEX(valeur; rech; retour; [absent])
Pourquoi pas RECHERCHEV ? Ne cherche qu'\xe0 droite, casse si colonne ins\xe9r\xe9e, plus lent.`,en:`INDEX/MATCH replaces VLOOKUP \u{2014} bidirectional and stable.
=INDEX(return_range, MATCH(value, lookup_range, 0))
XLOOKUP (365): =XLOOKUP(value, lookup, return, [not_found])
Why not VLOOKUP? Only looks right, breaks on column insert, slower.`},quiz:{q:{fr:"Site en col A, coûts col D. Récupérer le coût du site ABR ?",en:"Site in col A, costs col D. Retrieve cost for site ABR?"},opts:{fr:["RECHERCHEV","INDEX/EQUIV","Les deux identiques","SOMME.SI"],en:["VLOOKUP","INDEX/MATCH","Both identical","SUMIF"]},correct:1,explanation:{fr:"INDEX/EQUIV est professionnel, stable, bidirectionnel. RECHERCHEV casse si colonne insérée.",en:"INDEX/MATCH is professional, stable, bidirectional. VLOOKUP breaks on column insert."}},videos:[]},{title:{fr:"SOMME.SI.ENS & Tableaux Croisés Dynamiques",en:"SUMIFS & Pivot Tables"},content:{fr:`SOMME.SI.ENS : la formule CDG par excellence.

Power Query : Connecteur dossier \u{2192} empiler 4 fichiers sites \u{2192} nettoyer \u{2192} TCD.`,en:`SUMIFS: the CDG workhorse formula.
=SUMIFS(sum_range, criteria1_range, criteria1, criteria2_range, criteria2...)
Pivot Tables: Rows=Sites, Columns=Months, Values=Cost, Filter=Product.
Power Query: Folder connector \u{2192} append 4 site files \u{2192} clean \u{2192} pivot.`},quiz:{q:{fr:"Consolider 4 fichiers Excel mensuels de 4 sites. Meilleure approche ?",en:"Consolidate 4 monthly Excel files from 4 sites. Best approach?"},opts:{fr:["Copier-coller","Power Query connecteur dossier","VBA","RECHERCHEV entre fichiers"],en:["Copy-paste","Power Query folder connector","VBA","VLOOKUP between files"]},correct:1,explanation:{fr:"Power Query : un dossier, une connexion, actualisation en un clic. Scalable et maintenable.",en:"Power Query: one folder, one connection, one-click refresh. Scalable and maintainable."}},videos:[]}]},{id:"powerbi",icon:"📈",color:"#F2C811",term:3,title:{en:"Power BI & Dashboards",fr:"Power BI & Tableaux de Bord"},lessons:[{title:{fr:"Schéma étoile & DAX essentiel",en:"Star Schema & Essential DAX"},content:{fr:`SCH\xc9MA \xc9TOILE : FactProduction au centre + DimDate, DimSite, DimProduit autour. Relations 1:N de dimension vers fait.
DAX : % Total = DIVIDE([CA], CALCULATE([CA], ALL(DimSite))). YTD = TOTALYTD([CA], DimDate[Date]). N-1 = CALCULATE([CA], SAMEPERIODLASTYEAR(DimDate[Date])).`,en:`STAR SCHEMA: FactProduction at centre + DimDate, DimSite, DimProduct around it. 1:many from dimension to fact.
DAX: % Total = DIVIDE([Rev], CALCULATE([Rev], ALL(DimSite))). YTD = TOTALYTD([Rev], DimDate[Date]).`},quiz:{q:{fr:"Pourquoi une table unique aplatie est problématique en Power BI ?",en:"Why is a single flat table problematic in Power BI?"},opts:{fr:["Aucun problème","Lent, pas de drill-through, time intelligence cassée","Power BI gère auto","Ajouter de la RAM"],en:["No problem","Slow, no drill-through, broken time intelligence","PBI handles it","Add RAM"]},correct:1,explanation:{fr:"Le schéma étoile est requis pour la performance et le fonctionnement de DAX time intelligence.",en:"Star schema required for performance and DAX time intelligence to work correctly."}},videos:[]}]},{id:"writing",icon:"✍️",color:"#5C6BC0",term:4,title:{en:"Professional Writing",fr:"Écriture Professionnelle"},lessons:[{title:{fr:"Architecture d'un paragraphe",en:"Paragraph Architecture"},content:{fr:`Structure TEAL : Th\xe8se (conclusion en premier) \u{2192} Evidence (donn\xe9es chiffr\xe9es) \u{2192} Analyse (interpr\xe9tation) \u{2192} Lien (transition).

35% = 25% + 10% | 40% = 4 \xd7 10%`},ex:{en:"25% of 360 = 90 | 15% of 200 = 30 | 60% of 150 = 90",fr:"25% de 360 = 90 | 15% de 200 = 30 | 60% de 150 = 90"},tip:{en:"CDG context: these are used daily for margin and variance analysis.",fr:"Contexte CDG : utilisés quotidiennement pour l'analyse de marge et d'écarts."}},{t:{en:"Level 5 — Margin % + Division Tricks (CDG)",fr:"Niveau 5 — Marge % + Astuces Division (CDG)"},b:{en:`THE KEY CDG FORMULA:\nMargin % = (Revenue \\u{2212} Cost) \\xf7 Revenue \\xd7 100\n\nThis tells you what % of revenue is profit.\nHerm\\xe8s gross margin ~70%: for every \\u{20AC}100 revenue, \\u{20AC}70 is gross profit.\n\nSTEPS: 1. Subtract cost from revenue. 2. Divide by revenue. 3. \\xd7 100.\n\n\\u{2015}\\u{2015} DIVISION TRICK: SIMPLIFY BEFORE DIVIDING \\u{2015}\\u{2015}\n\nDon't tackle messy numbers head-on. Simplify the fraction first.\n\nEXAMPLE: 2200 \\xf7 4600\nStep 1 \\u{2014} Cancel trailing zeros: 22/46\nStep 2 \\u{2014} Both even, \\xf72: 11/23\nStep 3 \\u{2014} Estimate: 11/23 \\u{2248} 11/22 = 0.5, but 23 > 22 so slightly under\nAnswer: \\u{2248} 0.478 = 47.8%\n\nCOMMON CANCELLATIONS:\n\\xf72 \\u{2192} both even | \\xf75 \\u{2192} end in 0 or 5 | \\xf710 \\u{2192} end in 0\n\nESTIMATION ANCHORS:\n\\u{2022} top = 3/4 of bottom \\u{2192} 75%\n\\u{2022} top = 1/2 of bottom \\u{2192} 50%\n\\u{2022} top = 7/10 of bottom \\u{2192} 70% (Herm\\xe8s!)`,fr:`LA FORMULE CL\\xc9 DU CDG :\nMarge % = (CA \\u{2212} Co\\xfbt) \\xf7 CA \\xd7 100\n\nIndique quel % du CA est du profit.\nMarge brute Herm\\xe8s ~70% : pour 100\\u{20AC} de CA, 70\\u{20AC} de marge brute.\n\n\\xc9TAPES : 1. CA \\u{2212} Co\\xfbt. 2. Diviser par CA. 3. \\xd7 100.\n\n\\u{2015}\\u{2015} ASTUCE DIVISION : SIMPLIFIER AVANT DE DIVISER \\u{2015}\\u{2015}\n\nNe plongez pas dans des grands nombres. Simplifiez la fraction d'abord.\n\nEXEMPLE : 2200 \\xf7 4600\n\\xc9tape 1 \\u{2014} Supprimer les z\\xe9ros : 22/46\n\\xc9tape 2 \\u{2014} Les deux pairs, \\xf72 : 11/23\n\\xc9tape 3 \\u{2014} Estimation : 11/23 \\u{2248} 0,5, mais 23 > 22 donc un peu moins\nR\\xe9ponse : \\u{2248} 0,478 = 47,8%\n\nSIMPLIFICATIONS COURANTES :\n\\xf72 \\u{2192} les deux pairs | \\xf75 \\u{2192} finissent par 0 ou 5 | \\xf710 \\u{2192} finissent par 0\n\nANCRES D'ESTIMATION :\n\\u{2022} num = 3/4 du d\\xe9nom \\u{2192} 75%\n\\u{2022} num = moiti\\xe9 du d\\xe9nom \\u{2192} 50%\n\\u{2022} num = 7/10 du d\\xe9nom \\u{2192} 70% (Herm\\xe8s !)`},ex:{en:"Rev \\u{20AC}4600, Cost \\u{20AC}2400 \\u{2192} 2200/4600 \\xf72\\xf72 = 11/23 \\u{2248} 47.8% \\u{2713}\\nRev \\u{20AC}500, Cost \\u{20AC}200 \\u{2192} 300/500 \\xf7100 = 3/5 = 60% \\u{2713}\\nRev \\u{20AC}1200, Cost \\u{20AC}360 \\u{2192} 840/1200 \\xf760 = 7/10 = 70% \\u{2713}\\nRev \\u{20AC}800, Cost \\u{20AC}600 \\u{2192} 200/800 \\xf7200 = 1/4 = 25% \\u{2713}",fr:"CA 4600\\u{20AC}, Co\\xfbt 2400\\u{20AC} \\u{2192} 2200/4600 \\xf72\\xf72 = 11/23 \\u{2248} 47,8% \\u{2713}\\nCA 500\\u{20AC}, Co\\xfbt 200\\u{20AC} \\u{2192} 300/500 \\xf7100 = 3/5 = 60% \\u{2713}\\nCA 1200\\u{20AC}, Co\\xfbt 360\\u{20AC} \\u{2192} 840/1200 \\xf760 = 7/10 = 70% \\u{2713}\\nCA 800\\u{20AC}, Co\\xfbt 600\\u{20AC} \\u{2192} 200/800 \\xf7200 = 1/4 = 25% \\u{2713}"},tip:{en:"SPEED KEY: Always simplify first. 2200\\xf74600 \\u{2192} 11\\xf723 in 2 steps. Estimate vs anchors (50%, 70%, 75%). Far faster than long division under exam pressure.",fr:"CL\\xc9 VITESSE : Simplifiez toujours en premier. 2200\\xf74600 \\u{2192} 11\\xf723 en 2 \\xe9tapes. Estimez avec les ancres (50%, 70%, 75%). Bien plus rapide sous pression."}}],fractions:[{t:{en:"Level 1 — Simplifying Fractions",fr:"Niveau 1 — Simplifier les Fractions"},b:{en:`Find the LARGEST number that divides both top and bottom evenly (the GCD). Divide both by it.

STEPS:
1. Can both be divided by 2? If yes, do it. Repeat.
2. Try 3, then 5, then 7.
3. Stop when no number divides both evenly.

QUICK CHECK: If both are even \u{2192} divide by 2. If both end in 0 or 5 \u{2192} divide by 5.`,fr:`Trouvez le PLUS GRAND nombre qui divise le num\xe9rateur ET le d\xe9nominateur (le PGCD). Divisez les deux.

\xc9TAPES :
1. Les deux divisibles par 2 ? Oui \u{2192} divisez. R\xe9p\xe9tez.
2. Essayez 3, puis 5, puis 7.
3. Arr\xeatez quand aucun nombre ne divise les deux.

V\xc9RIFICATION : Les deux pairs \u{2192} \xf7 2. Finissent par 0 ou 5 \u{2192} \xf7 5.`},ex:{en:"12/18 → GCD=6 → 2/3\n8/20 → GCD=4 → 2/5\n15/25 → GCD=5 → 3/5",fr:"12/18 → PGCD=6 → 2/3\n8/20 → PGCD=4 → 2/5\n15/25 → PGCD=5 → 3/5"},tip:{en:"Type answers as: numerator/denominator (e.g. 2/3)",fr:"Tapez : numérateur/dénominateur (ex : 2/3)"}},{t:{en:"Level 2 — Adding & Subtracting Fractions",fr:"Niveau 2 — Addition & Soustraction de Fractions"},b:{en:`SAME DENOMINATOR (this quiz): Just add/subtract the tops. Keep the bottom. Simplify.

3/8 + 2/8 = 5/8 \u{2713}

DIFFERENT DENOMINATORS (advanced):
1. Find common denominator (LCM)
2. Convert each fraction
3. Add/subtract tops
4. Simplify

1/3 + 1/4 \u{2192} LCM=12 \u{2192} 4/12 + 3/12 = 7/12`,fr:`M\xcaME D\xc9NOMINATEUR (ce quiz) : Additionnez les num\xe9rateurs. Gardez le d\xe9nominateur. Simplifiez.

3/8 + 2/8 = 5/8 \u{2713}

D\xc9NOMINATEURS DIFF\xc9RENTS (avanc\xe9) :
1. Trouvez le d\xe9nominateur commun (PPCM)
2. Convertissez chaque fraction
3. Additionnez/soustrayez les num\xe9rateurs
4. Simplifiez

1/3 + 1/4 \u{2192} PPCM=12 \u{2192} 4/12 + 3/12 = 7/12`},ex:{en:"2/7 + 3/7 = 5/7\n5/6 − 1/6 = 4/6 = 2/3\n3/10 + 4/10 = 7/10",fr:"2/7 + 3/7 = 5/7\n5/6 − 1/6 = 4/6 = 2/3\n3/10 + 4/10 = 7/10"},tip:{en:"Always simplify your final answer!",fr:"Simplifiez toujours votre réponse !"}},{t:{en:"Level 3 — Multiplying Fractions",fr:"Niveau 3 — Multiplier des Fractions"},b:{en:`The EASIEST fraction operation:
1. Multiply tops together (numerator \xd7 numerator)
2. Multiply bottoms together (denominator \xd7 denominator)
3. Simplify the result

PRO TIP \u{2014} Cross-cancel BEFORE multiplying:
If a top number and the OTHER bottom share a factor, divide both first. Keeps numbers small.

3/4 \xd7 2/9 \u{2192} 3 and 9 share 3 \u{2192} becomes 1/4 \xd7 2/3 = 2/12 = 1/6`,fr:`L'op\xe9ration la PLUS SIMPLE :
1. Multipliez les num\xe9rateurs (haut \xd7 haut)
2. Multipliez les d\xe9nominateurs (bas \xd7 bas)
3. Simplifiez

ASTUCE PRO \u{2014} Simplifiez en croix AVANT :
Si un num\xe9rateur et l'AUTRE d\xe9nominateur partagent un facteur, divisez les deux d'abord.

3/4 \xd7 2/9 \u{2192} 3 et 9 partagent 3 \u{2192} 1/4 \xd7 2/3 = 2/12 = 1/6`},ex:{en:"2/3 × 4/5 = 8/15\n1/2 × 3/4 = 3/8\n5/6 × 2/5 → cancel 5s → 1/6 × 2/1 = 2/6 = 1/3",fr:"2/3 × 4/5 = 8/15\n1/2 × 3/4 = 3/8\n5/6 × 2/5 → simplifier 5 → 1/6 × 2/1 = 2/6 = 1/3"}},{t:{en:"Bonus — Dividing Fractions",fr:"Bonus — Diviser des Fractions"},b:{en:`THE GOLDEN RULE: Keep, Change, Flip (KCF)
1. KEEP the first fraction
2. CHANGE \xf7 to \xd7
3. FLIP the second fraction (swap top and bottom)
4. Multiply as normal
5. Simplify

WHY? Dividing by a fraction = multiplying by its reciprocal.`,fr:`LA R\xc8GLE D'OR : Garder, Changer, Inverser
1. GARDER la premi\xe8re fraction
2. CHANGER \xf7 en \xd7
3. INVERSER la deuxi\xe8me (\xe9changer haut et bas)
4. Multiplier normalement
5. Simplifier

POURQUOI ? Diviser par une fraction = multiplier par son inverse.`},ex:{en:"3/4 ÷ 2/5 → 3/4 × 5/2 = 15/8\n1/2 ÷ 1/3 → 1/2 × 3/1 = 3/2",fr:"3/4 ÷ 2/5 → 3/4 × 5/2 = 15/8\n1/2 ÷ 1/3 → 1/2 × 3/1 = 3/2"}}],percentages:[{t:{en:"Level 1 — Finding a % of a Number",fr:"Niveau 1 — Trouver un % d'un Nombre"},b:{en:`"Percent" = "per hundred". 25% = 25/100 = 0.25.

To find X% of a number: multiply by X \xf7 100.

MENTAL SHORTCUTS \u{2014} memorise these:
10% = \xf7 10 | 20% = \xf7 5 | 25% = \xf7 4
50% = \xf7 2 | 5% = half of 10% | 1% = \xf7 100

COMBINE: 35% = 25% + 10%. 15% = 10% + 5%.`,fr:`"Pour cent" = "sur cent". 25% = 25/100 = 0,25.

X% d'un nombre = multiplier par X \xf7 100.

RACCOURCIS \u{2014} m\xe9morisez :
10% = \xf7 10 | 20% = \xf7 5 | 25% = \xf7 4
50% = \xf7 2 | 5% = moiti\xe9 de 10% | 1% = \xf7 100

COMBINEZ : 35% = 25% + 10%. 15% = 10% + 5%.`},ex:{en:"10% of 350 = 35\n25% of 80 = 20\n50% of 90 = 45",fr:"10% de 350 = 35\n25% de 80 = 20\n50% de 90 = 45"}},{t:{en:"Level 2 — Adding a Percentage (Markup)",fr:"Niveau 2 — Ajouter un % (Majoration)"},b:{en:`To add X% to a number: multiply by (1 + X/100).

+20% \u{2192} \xd7 1.20 | +5% \u{2192} \xd7 1.05 | +15% \u{2192} \xd7 1.15

OR: find the percentage, then add it to the original.
200 + 15% \u{2192} 15% of 200 = 30 \u{2192} 200 + 30 = 230.

CDG USE: Budget increases, cost escalations, VAT calculations.`,fr:`Ajouter X% \xe0 un nombre : multiplier par (1 + X/100).

+20% \u{2192} \xd7 1,20 | +5% \u{2192} \xd7 1,05 | +15% \u{2192} \xd7 1,15

OU : trouvez le %, puis ajoutez-le.
200 + 15% \u{2192} 15% de 200 = 30 \u{2192} 200 + 30 = 230.

CDG : Augmentations budg\xe9taires, escalade des co\xfbts, TVA.`},ex:{en:"200 + 15% = 230\n500 + 20% = 600\n80 + 25% = 100",fr:"200 + 15% = 230\n500 + 20% = 600\n80 + 25% = 100"},tip:{en:"Round to 2 decimal places if needed.",fr:"Arrondissez à 2 décimales."}},{t:{en:"Level 3 — Percentage Change (CDG Essential)",fr:"Niveau 3 — Variation % (Essentiel CDG)"},b:{en:`THE CDG FORMULA YOU WILL USE EVERY SINGLE DAY:

% Change = (New \u{2212} Old) / Old \xd7 100

USED FOR: Budget vs Actual variance, YoY revenue growth, cost evolution, KPI tracking.

CRITICAL: Always divide by the ORIGINAL (old) value.`,fr:`LA FORMULE QUE VOUS UTILISEREZ CHAQUE JOUR EN CDG :

% Variation = (Nouveau \u{2212} Ancien) / Ancien \xd7 100

Positif = hausse. N\xe9gatif = baisse.

UTILIS\xc9 POUR : \xc9cart budget/r\xe9el, croissance CA, \xe9volution des co\xfbts, suivi KPI.
