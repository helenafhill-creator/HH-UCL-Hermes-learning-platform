tion(e,t,n){return S.H.useFormState(e,t,n)},g=function(){return S.H.useHostTransitionStatus()},b="19.2.4"});var f={};f=c("j8mK4");var p=c("2xBnP"),m={};!function e(){if("u">typeof __REACT_DEVTOOLS_GLOBAL_HOOK__&&"function"==typeof __REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE)try{__REACT_DEVTOOLS_GLOBAL_HOOK__.checkDCE(e)}catch(e){console.error(e)}}(),m=c("DUEQU");var p=c("2xBnP");let h=[{id:"cdg_positionnement",icon:"🎯",color:"#E8630A",term:0,title:{en:"1. Role & Positioning of CDG",fr:"1. Positionnement du Contrôle de Gestion"},lessons:[{title:{fr:"Le CDG : définition, missions et place dans l'organisation",en:"CDG: Definition, Missions & Organisational Role"},content:{fr:`Le contr\xf4le de gestion est un processus par lequel les dirigeants s'assurent que les ressources sont obtenues et utilis\xe9es avec efficacit\xe9 (atteinte des objectifs) et efficience (optimisation des moyens).

ATTENTION : \xab Contr\xf4le \xbb ne signifie pas \xab v\xe9rification \xbb. Contr\xf4ler = ma\xeetriser, piloter. Le CDG est un copilote de la performance, pas un inspecteur.

LE TRIANGLE DU CDG : 1. PR\xc9VOIR (budgets, plans, forecasts) \u{2014} 2. MESURER (comptabilit\xe9 analytique, co\xfbts, reporting) \u{2014} 3. AGIR (analyse des \xe9carts, recommandations, actions correctives).

POSITIONNEMENT : Le CDG se situe entre le contr\xf4le strat\xe9gique (direction g\xe9n\xe9rale, horizon 3-5 ans) et le contr\xf4le op\xe9rationnel (terrain, quotidien). Il assure le lien entre la strat\xe9gie et l'ex\xe9cution.

LES CENTRES DE RESPONSABILIT\xc9 :
\u{2022} Centre de CO\xdbTS : ma\xeetrise des charges uniquement (ex : atelier Herm\xe8s les Abrets). Indicateur : co\xfbt unitaire vendable.
\u{2022} Centre de REVENUS : ma\xeetrise du CA (ex : direction commerciale). Indicateur : CA, parts de march\xe9.
\u{2022} Centre de PROFIT : ma\xeetrise CA + co\xfbts (ex : boutique DOS Herm\xe8s). Indicateur : marge, r\xe9sultat.
\u{2022} Centre d'INVESTISSEMENT : ma\xeetrise CA + co\xfbts + actifs (ex : filiale). Indicateur : ROI, EVA.

LE PROCESSUS BUDG\xc9TAIRE : Plan strat\xe9gique (3-5 ans) \u{2192} Plan op\xe9rationnel (1 an) \u{2192} Budgets mensuels \u{2192} Reporting \u{2192} Analyse des \xe9carts \u{2192} Actions correctives \u{2192} Forecast r\xe9vis\xe9.

PLACE DANS L'ORGANISATION : Selon la taille, le CDG peut \xeatre rattach\xe9 \xe0 la DAF (direction financi\xe8re) ou \xeatre une fonction transversale. Dans les grandes entreprises comme Herm\xe8s, chaque site industriel a son propre CDG qui reporte au p\xf4le finance.`,en:`Management control (contr\xf4le de gestion) ensures resources are obtained and used with effectiveness (achieving goals) and efficiency (optimising means).

THE CDG TRIANGLE: 1. FORECAST (budgets, plans) \u{2014} 2. MEASURE (analytical accounting, costs, reporting) \u{2014} 3. ACT (variance analysis, recommendations, corrective actions).

RESPONSIBILITY CENTRES: Cost centre (controls expenses only) \u{2014} Revenue centre (controls sales) \u{2014} Profit centre (controls both) \u{2014} Investment centre (controls assets too).

POSITIONING: CDG sits between strategic control (board level, 3-5yr horizon) and operational control (shop floor, daily). It links strategy to execution.`},quiz:{q:{fr:"Le site Hermès des Abrets est quel type de centre de responsabilité ?",en:"Hermès les Abrets site is what type of responsibility centre?"},opts:{fr:["Centre de profit","Centre de coûts","Centre d'investissement","Centre de revenus"],en:["Profit centre","Cost centre","Investment centre","Revenue centre"]},correct:1,explanation:{fr:"Les Abrets est un centre de coûts : le CA est fixé par la Distribution, le CDG ne maîtrise que les charges de production.",en:"Les Abrets is a cost centre: revenue is set by Distribution, CDG only controls production costs."}},videos:[]},{title:{fr:"Pilotage et performance : le CDG en site industriel",en:"Performance Management: CDG in a Manufacturing Site"},content:{fr:`Chez Herm\xe8s, le CDG en site industriel (alternance Maroquineries des Alpes) a trois missions :

1. CL\xd4TURE MENSUELLE : J+2 Flash, J+5 Pr\xe9-cl\xf4ture, J+8 Cl\xf4ture d\xe9finitive.
T\xe2ches : corriger les feuilles de temps artisans, construire la synth\xe8se de performance du site, consolider le reporting des 4 sites du p\xf4le.

2. CONTR\xd4LE INTERNE : Rapprochement 3 voies (BC/BL/Facture), inventaires physiques, cadre de contr\xf4le Groupe.

3. PILOTAGE DES CO\xdbTS : Suivi du co\xfbt unitaire vendable, analyse des \xe9carts r\xe9el vs budget, am\xe9lioration des outils de reporting.

LE CUT-OFF : Si du cuir est livr\xe9 le 28/12 mais factur\xe9 le 05/01, le co\xfbt appartient \xe0 d\xe9cembre. \xc9criture : D\xe9bit 601 (Achats) / Cr\xe9dit 4081 (FNP). Contre-passation en janvier. Principe de sp\xe9cialisation des exercices (PCG).

KPIs INDUSTRIELS HERM\xc8S :
\u{2022} TRS (OEE) = Disponibilit\xe9 \xd7 Performance \xd7 Qualit\xe9. Cible >85%.
\u{2022} Taux de rejet : ~16% (standard volontairement \xe9lev\xe9 \u{2014} perfection exig\xe9e).
\u{2022} Co\xfbt unitaire vendable = Co\xfbt total / Unit\xe9s CONFORMES au CQ.
  1 000 sacs produits, 160 rejet\xe9s \u{2192} Co\xfbt/u = 1M\u{20AC} / 840 = 1 190\u{20AC} (PAS 1M\u{20AC}/1000 = 1 000\u{20AC}).`,en:`At Herm\xe8s, the CDG in an industrial site has three missions:

1. MONTHLY CLOSE: D+2 Flash, D+5 Pre-close, D+8 Final close. Tasks: correct artisan timesheets, build site performance summary, consolidate 4-site pole reporting.

2. INTERNAL CONTROL: Three-way matching (PO/delivery/invoice), physical counts, Group framework.

3. COST MANAGEMENT: Track cost per saleable unit, analyse actual vs budget variances, improve reporting tools.

CUT-OFF: Leather delivered 28/12, invoiced 05/01 \u{2192} cost belongs to December. Entry: Debit 601 / Credit 4081 (FNP). Reversed January.

KEY KPIs: OEE >85%. Reject rate ~16%. Cost per saleable unit = Total cost / Units PASSING QC.`},quiz:{q:{fr:"500 sacs produits, coût total 600K€, 80 rejetés au CQ. Coût unitaire vendable ?",en:"500 bags produced, €600K total cost, 80 rejected at QC. Cost per saleable unit?"},opts:{fr:["1 200€","1 429€","750€","1 500€"],en:["€1,200","€1,429","€750","€1,500"]},correct:1,explanation:{fr:"600K / (500-80) = 600K / 420 = 1 429€. Les sacs rejetés ne génèrent pas de revenu mais ont consommé des ressources.",en:"€600K / (500-80) = €600K / 420 = €1,429. Rejected bags generate no revenue but consumed resources."}},videos:[]}]},{id:"cdg_couts",icon:"🧮",color:"#D4A017",term:0,title:{en:"2. Cost Determination & Analysis (UE11)",fr:"2. Détermination et Analyse des Coûts (UE11)"},lessons:[{title:{fr:"Coûts complets — Méthode des centres d'analyse",en:"Full Costing — Cost Centre Method"},content:{fr:`LA m\xe9thode de r\xe9f\xe9rence du PCG. Alloue TOUTES les charges aux produits.

DIRECTES vs INDIRECTES : Directes = affectables \xe0 un produit (cuir Togo pour Birkin). Indirectes = partag\xe9es (\xe9lectricit\xe9 atelier, salaire chef d'atelier).

\xc9TAPES : 1. R\xe9partition primaire (charges \u{2192} centres). 2. R\xe9partition secondaire (centres auxiliaires \u{2192} principaux). 3. Co\xfbt de l'UO = Total centre / Nb UO. 4. Imputation = Nb UO consomm\xe9es \xd7 Co\xfbt UO.

EXEMPLE : Charges indirectes atelier 800K\u{20AC}. UO = heure MOD. 5 000h/mois. Co\xfbt UO = 160\u{20AC}/h.
Birkin 30 (18h MOD) : Indirect 2 880\u{20AC} + Cuir 1 200\u{20AC} + MOD 810\u{20AC} = 4 890\u{20AC}.

LIMITES : Cl\xe9s subjectives. Fixe r\xe9parti par volume. Pas de distinction fixe/variable.`,en:`THE reference method of the PCG. Allocates ALL costs to products.

STEPS: 1. Primary allocation (costs \u{2192} centres). 2. Secondary (auxiliary \u{2192} main centres). 3. Cost per UO = Total / No. UO. 4. Imputation = UO consumed \xd7 Cost per UO.

EXAMPLE: Workshop indirect \u{20AC}800K. UO = MOD hour. 5,000h/month. Cost/UO = \u{20AC}160/h. Birkin 30 (18h): Indirect \u{20AC}2,880 + Leather \u{20AC}1,200 + Labour \u{20AC}810 = \u{20AC}4,890.`},quiz:{q:{fr:"Charges indirectes 600K€, 4 000h MOD. Kelly : 15h MOD, cuir 950€, MOD 45€/h. Coût complet ?",en:"Indirect €600K, 4,000h MOD. Kelly: 15h, leather €950, labour €45/h. Full cost?"},opts:{fr:["3 875€","4 175€","3 200€","5 100€"],en:["€3,875","€4,175","€3,200","€5,100"]},correct:0,explanation:{fr:"UO = 600K/4000 = 150€/h. Indirect = 15×150 = 2 250. Cuir 950. MOD = 15×45 = 675. Total = 3 875€.",en:"UO = €150/h. Indirect = 15×150 = €2,250. Leather €950. Labour 15×45 = €675. Total = €3,875."}},videos:[]},{title:{fr:"Méthode ABC — Activity-Based Costing",en:"ABC — Activity-Based Costing"},content:{fr:`Corrige les distorsions des centres d'analyse. Les produits consomment des ACTIVIT\xc9S, les activit\xe9s consomment des ressources.

VOCABULAIRE : Activit\xe9 (t\xe2ches homog\xe8nes), Inducteur de co\xfbt (d\xe9clencheur), Co\xfbt unitaire inducteur = Co\xfbt activit\xe9 / Volume inducteur.

POURQUOI ABC EST PLUS JUSTE : Activit\xe9 \xab CQ \xbb : 240K\u{20AC}/mois. Inducteur = nb contr\xf4les. Birkin = 1 contr\xf4le, Porte-cartes = 1 contr\xf4le. Avec centres d'analyse (UO=heure MOD), le porte-cartes n'absorbe quasi rien. Avec ABC : chaque produit absorbe son contr\xf4le proportionnellement.

DIFF\xc9RENCE CL\xc9 : Centres d'analyse = charges par LIEUX. ABC = charges par PROCESSUS.

QUAND UTILISER : Charges indirectes >30% du co\xfbt total. Produits tr\xe8s diversifi\xe9s. Volumes tr\xe8s diff\xe9rents.`,en:`Corrects distortions of cost centre method. Products consume ACTIVITIES, activities consume resources.

KEY DIFFERENCE: Cost centres route costs through PLACES. ABC routes through PROCESSES.

WHEN TO USE: Indirect costs >30% of total. Diverse products. Very different volumes.`},quiz:{q:{fr:"Activité Lancement OF : 180K€, 600 OF. Birkin = 1 OF/10 sacs. Porte-cartes = 1 OF/100. Coût lancement par unité ?",en:"Launch PO activity: €180K, 600 orders. Birkin = 1 order/10 bags. Card holder = 1/100. Cost per unit?"},opts:{fr:["Birkin 30€, Porte-cartes 3€","300€ chacun","Birkin 180€, PC 1,80€","Même coût"],en:["Birkin €30, Card holder €3","€300 each","Birkin €180, CH €1.80","Same cost"]},correct:0,explanation:{fr:"300€/OF. Birkin : 300/10 = 30€/sac. PC : 300/100 = 3€/u. ABC révèle le vrai coût par inducteur.",en:"€300/order. Birkin: 300/10 = €30/bag. Card holder: 300/100 = €3/unit."}},videos:[]},{title:{fr:"Coûts variables et seuil de rentabilité",en:"Variable Costing & Break-Even"},content:{fr:`Seules les charges variables sont retenues dans le co\xfbt des produits. Les fixes = charges de p\xe9riode.

MCV = CA - Charges Variables. Taux MCV = MCV/CA.
SEUIL DE RENTABILIT\xc9 = CF / Taux MCV.
Point mort en jours = (SR/CA annuel) \xd7 365.

EXEMPLE : CA 180M\u{20AC}, CV 72M\u{20AC} (40%), MCV = 108M\u{20AC} (60%), CF = 54M\u{20AC}. SR = 54/0,60 = 90M\u{20AC}. Point mort = 182,5 jours (d\xe9but juillet).

D\xc9CISION CL\xc9 : Commande sp\xe9ciale \xe0 prix r\xe9duit ? Si prix > co\xfbt variable ET capacit\xe9 dispo \u{2192} ACCEPTER (contribue aux CF d\xe9j\xe0 couvertes).

MARGE DE S\xc9CURIT\xc9 = CA - SR. Indice de s\xe9curit\xe9 = (CA-SR)/CA. Plus l'indice est \xe9lev\xe9, plus l'entreprise est \xe0 l'abri d'une baisse d'activit\xe9.`,en:`Only variable costs go to products. Fixed = period expenses.

CM = Revenue - Variable Costs. CM ratio = CM/Revenue. BEP = Fixed Costs / CM ratio. Break-even days = (BEP/Annual Revenue) \xd7 365.

DECISION: Special order at reduced price? If price > variable cost AND capacity available \u{2192} ACCEPT (contributes to fixed costs already covered).`},quiz:{q:{fr:"CF = 54M€, Taux MCV = 60%, CA = 180M€. Marge de sécurité et indice de sécurité ?",en:"FC = €54M, CM ratio = 60%, Revenue = €180M. Safety margin and safety index?"},opts:{fr:["MS = 90M€, IS = 50%","MS = 126M€, IS = 70%","MS = 54M€, IS = 30%","MS = 108M€, IS = 60%"],en:["SM = €90M, SI = 50%","SM = €126M, SI = 70%","SM = €54M, SI = 30%","SM = €108M, SI = 60%"]},correct:0,explanation:{fr:"SR = 54/0,6 = 90M€. MS = 180-90 = 90M€. IS = 90/180 = 50%. L'entreprise peut perdre 50% de son CA avant d'être en perte.",en:"BEP = €90M. SM = 180-90 = €90M. SI = 90/180 = 50%. Company can lose 50% of revenue before loss."}},videos:[]},{title:{fr:"Coûts spécifiques et imputation rationnelle",en:"Specific Costs & Rational Imputation"},content:{fr:`CO\xdbTS SP\xc9CIFIQUES : On impute les charges fixes PROPRES \xe0 chaque produit. Les charges fixes communes restent non imput\xe9es.
Marge sur co\xfbt sp\xe9cifique = MCV - Charges fixes directes.
Si la marge sur co\xfbt sp\xe9cifique est n\xe9gative \u{2192} le produit ne couvre m\xeame pas ses propres charges fixes \u{2192} envisager l'abandon.

IMPUTATION RATIONNELLE DES CHARGES FIXES :
Probl\xe8me : quand l'activit\xe9 baisse, le co\xfbt unitaire augmente (charges fixes r\xe9parties sur moins d'unit\xe9s). Cela fausse la comparabilit\xe9.
Solution : n'imputer que la part des CF correspondant \xe0 l'activit\xe9 normale.
Coefficient d'imputation = Activit\xe9 r\xe9elle / Activit\xe9 normale.
CF imput\xe9es = CF \xd7 Coefficient. Diff\xe9rence = co\xfbt de sous-activit\xe9 (ou bonus de suractivit\xe9).

EXEMPLE : CF = 200K\u{20AC}, Activit\xe9 normale = 1 000h, R\xe9elle = 800h.
Coeff = 800/1000 = 0,8. CF imput\xe9es = 200K \xd7 0,8 = 160K\u{20AC}. Co\xfbt de sous-activit\xe9 = 40K\u{20AC}.
Ce 40K\u{20AC} n'est PAS imputable aux produits \u{2014} c'est le co\xfbt de la capacit\xe9 non utilis\xe9e, \xe0 la charge de la direction.`,en:`SPECIFIC COSTS: Allocate product-specific fixed costs. Common fixed costs stay unallocated. Specific margin = CM - Direct fixed costs. If negative \u{2192} consider dropping the product.

RATIONAL IMPUTATION: When activity drops, unit cost rises (fixed costs over fewer units). Solution: only impute fixed costs proportional to normal activity.
Coefficient = Actual activity / Normal activity. Under-activity cost = FC \xd7 (1 - coefficient).`},quiz:{q:{fr:"CF = 300K€, activité normale 1 500h, réelle 1 200h. CF imputées et coût de sous-activité ?",en:"FC = €300K, normal activity 1,500h, actual 1,200h. Imputed FC and under-activity cost?"},opts:{fr:["240K€ imputées, 60K€ sous-activité","300K€, 0€","180K€, 120K€","360K€, -60K€"],en:["€240K imputed, €60K under-activity","€300K, €0","€180K, €120K","€360K, -€60K"]},correct:0,explanation:{fr:"Coeff = 1200/1500 = 0,8. CF imputées = 300K × 0,8 = 240K€. Sous-activité = 300K - 240K = 60K€.",en:"Coeff = 1200/1500 = 0.8. Imputed = €300K × 0.8 = €240K. Under-activity = €60K."}},videos:[]}]},{id:"cdg_budget",icon:"📉",color:"#C62828",term:0,title:{en:"3. Budgetary Management",fr:"3. La Gestion Budgétaire"},lessons:[{title:{fr:"Analyse des écarts sur charges directes",en:"Direct Cost Variances"},content:{fr:`CONVENTION PCG : \xc9cart = R\xe9el - Pr\xe9\xe9tabli. Positif = D\xc9FAVORABLE. N\xe9gatif = FAVORABLE.
ATTENTION : Favorable \u{2260} Bon (cuir moins cher mais plus de rejets = catastrophe).

MATI\xc8RES : \xc9cart prix = (Pr-Ps) \xd7 Qr \u{2192} Achats. \xc9cart quantit\xe9 = (Qr-Qs) \xd7 Ps \u{2192} Production.
Qs = standard unitaire \xd7 production r\xe9elle.

EXEMPLE Birkin, production 100 sacs. Standard : 1,5m\xb2 \xe0 180\u{20AC}/m\xb2. R\xe9el : 1,65m\xb2 \xe0 195\u{20AC}/m\xb2.
\xc9/prix = (195-180) \xd7 165 = +2 475\u{20AC} D\xc9F. \xc9/qt\xe9 = (165-150) \xd7 180 = +2 700\u{20AC} D\xc9F. Total +5 175\u{20AC}.

MOD : \xc9cart taux = (Tr-Ts) \xd7 Hr \u{2192} RH. \xc9cart temps = (Hr-Hs) \xd7 Ts \u{2192} Production.

COMMENTAIRE D'\xc9CART (format direction) : 1. QUOI (+5 175\u{20AC}, +19%). 2. POURQUOI (prix Togo +8,3%, chutes +10%). 3. R\xc9CURRENT ? (oui, CITES). 4. IMPACT ANNUEL (+62K\u{20AC}, recommandation : ren\xe9gocier contrat).`,en:`PCG CONVENTION: Variance = Actual - Standard. Positive = UNFAVOURABLE. Negative = FAVOURABLE.

MATERIALS: Price variance = (Actual price - Std price) \xd7 Actual qty \u{2192} Procurement. Usage variance = (Actual qty - Std qty) \xd7 Std price \u{2192} Production.

LABOUR: Rate variance = (Actual rate - Std rate) \xd7 Actual hours \u{2192} HR. Efficiency = (Actual hrs - Std hrs) \xd7 Std rate \u{2192} Production.

COMMENTARY FORMAT: 1. WHAT. 2. WHY. 3. RECURRING? 4. ANNUAL IMPACT + recommendation.`},quiz:{q:{fr:"MOD Kelly : standard 15h à 42€/h. Réel 80 Kelly : 1 280h à 44€/h. Écarts taux et temps ?",en:"MOD Kelly: standard 15h at €42/h. Actual 80 Kellys: 1,280h at €44/h. Rate and efficiency variances?"},opts:{fr:["+2 560€ taux, +3 360€ temps","+2 560€ taux, +840€ temps","+3 360€, +2 560€","−2 560€, +3 360€"],en:["+€2,560 rate, +€3,360 efficiency","+€2,560 rate, +€840 efficiency","+€3,360, +€2,560","−€2,560, +€3,360"]},correct:0,explanation:{fr:"Hs = 80×15 = 1 200h. Taux = (44-42)×1280 = 2 560€ DÉF. Temps = (1280-1200)×42 = 3 360€ DÉF. Total 5 920€.",en:"Std hrs = 80×15 = 1,200. Rate = (44-42)×1,280 = €2,560. Efficiency = (1,280-1,200)×42 = €3,360. Total €5,920."}},videos:[]},{title:{fr:"Écarts sur charges indirectes — Budget flexible",en:"Indirect Cost Variances — Flexible Budget"},content:{fr:`Les charges indirectes = fixe + variable \u{2192} d\xe9composition en 3 sous-\xe9carts (PCG).

BUDGET FLEXIBLE = (CV par UO \xd7 Activit\xe9 r\xe9elle) + CF.
CSUO = (CV\xd7AN + CF) / AN.

3 SOUS-\xc9CARTS :
1. \xc9CART SUR BUDGET = R\xe9el - Budget flexible(AR) \u{2192} a-t-on plus d\xe9pens\xe9 ? (responsabilit\xe9 gestionnaire)
2. \xc9CART SUR ACTIVIT\xc9 = BF(AR) - CSUO\xd7AR \u{2192} sur/sous-absorption des CF (responsabilit\xe9 direction)
3. \xc9CART SUR RENDEMENT = CSUO\xd7AR - CSUO\xd7(std\xd7prod r\xe9elle) \u{2192} efficacit\xe9 (responsabilit\xe9 production)

V\xc9RIFICATION : \xc9/budget + \xc9/activit\xe9 + \xc9/rendement = \xc9cart global.

EXEMPLE : Budget 500K\u{20AC} pour 2 000 UO. CF 200K\u{20AC}, CV 150\u{20AC}/UO. CSUO = 250\u{20AC}/UO.
R\xe9el : 2 200 UO, co\xfbt 560K\u{20AC}, production 440 (5 UO/produit).
BF = 150\xd72200 + 200K = 530K\u{20AC}. \xc9/budget = 560-530 = +30K D\xc9F. \xc9/activit\xe9 = 530-550 = -20K FAV. \xc9/rendement = 550-550 = 0. Total = +10K D\xc9F \u{2713}`,en:`Indirect costs = fixed + variable \u{2192} 3 PCG sub-variances.

FLEXIBLE BUDGET = (VC per UO \xd7 Actual activity) + FC.

3 SUB-VARIANCES: 1. SPENDING = Actual - Flex Budget. 2. ACTIVITY (VOLUME) = Flex Budget - Std cost of actual activity. 3. EFFICIENCY = Std cost of actual activity - Std cost of actual production.

VERIFICATION: Spending + Activity + Efficiency = Total variance.`},quiz:{q:{fr:"L'écart sur activité est de -15K€ (favorable). Que signifie-t-il ?",en:"Activity variance is -€15K (favourable). What does it mean?"},opts:{fr:["On a dépensé moins","L'activité réelle > activité normale → meilleure absorption des CF","Les ouvriers sont plus efficaces","Les prix ont baissé"],en:["We spent less","Actual activity > normal → better absorption of FC","Workers more efficient","Prices dropped"]},correct:1,explanation:{fr:"Écart activité favorable = suractivité = CF réparties sur plus d'UO = coût fixe unitaire diminue. C'est le principe de l'imputation rationnelle.",en:"Favourable activity variance = over-activity = fixed costs spread over more units = lower unit fixed cost."}},videos:[]}]},{id:"cdg_pilotage",icon:"📊",color:"#2E86AB",term:0,title:{en:"4. Performance Improvement Tools",fr:"4. Outils d'Amélioration des Performances"},lessons:[{title:{fr:"Le Tableau de Bord — Méthode OVAR",en:"Tableau de Bord — OVAR Method"},content:{fr:`Le TdB est un outil de PILOTAGE (d\xe9cision + action), pas un simple reporting (information remontante).

M\xc9THODE OVAR : O=Objectifs, V=Variables d'action, A=plans d'Action, R=Responsabilit\xe9s.
Pour chaque variable d'action \u{2192} un INDICATEUR (r\xe9sultat, moyen, ou processus).

R\xc8GLES D'OR : Max 10-15 indicateurs. Objectif chiffr\xe9 + tol\xe9rance. Code couleur (Vert/Orange/Rouge). Fr\xe9quence adapt\xe9e.

BALANCED SCORECARD (Kaplan & Norton) : 4 axes \u{2014} Financier, Clients, Processus internes, Apprentissage/Innovation. \xc9quilibre entre indicateurs financiers et non-financiers.

CO\xdbT CIBLE (Target Costing) : Prix de vente impos\xe9 par le march\xe9 - Marge souhait\xe9e = Co\xfbt cible. On con\xe7oit le produit POUR le co\xfbt, pas l'inverse. Tr\xe8s utilis\xe9 chez les constructeurs automobiles, pertinent en luxe pour les accessoires d'entr\xe9e de gamme.

BENCHMARKING : Comparer ses processus aux meilleurs (interne, concurrentiel, fonctionnel). Identifier les \xe9carts de performance et adapter les bonnes pratiques.`,en:`The TdB is a STEERING tool (decision + action), not just reporting (upward information flow).

OVAR METHOD: Objectives, Variables, Action plans, Responsibilities. Each variable \u{2192} an INDICATOR.

BALANCED SCORECARD: 4 axes \u{2014} Financial, Customer, Internal processes, Learning/Innovation.

TARGET COSTING: Market price - Desired margin = Target cost. Design to cost, not cost to design.

BENCHMARKING: Compare processes to best-in-class. Identify performance gaps. Adapt best practices.`},quiz:{q:{fr:"Différence fondamentale entre tableau de bord et reporting ?",en:"Fundamental difference between tableau de bord and reporting?"},opts:{fr:["Le TdB est plus détaillé","Le TdB pilote l'action (outil du responsable), le reporting informe la hiérarchie","Aucune différence","Le reporting est plus fréquent"],en:["TdB is more detailed","TdB steers action (manager's tool), reporting informs hierarchy","No difference","Reporting is more frequent"]},correct:1,explanation:{fr:"Le TdB est synthétique, ciblé, pour agir. Le reporting est exhaustif, détaillé, pour rendre compte. Deux outils complémentaires mais distincts.",en:"TdB is synthetic, targeted, for action. Reporting is exhaustive, detailed, for accountability. Complementary but distinct."}},videos:[]}]},{id:"accounting",icon:"📊",color:"#FF6F00",term:1,title:{en:"Accounting for Business Decisions",fr:"Comptabilité pour Décisions"},lessons:[{title:{en:"The Three Financial Statements",fr:"Les Trois États Financiers"},content:{fr:`CdR : CA \u{2192} COGS \u{2192} Marge brute \u{2192} Charges d'exploitation \u{2192} EBIT \u{2192} R\xe9sultat net. Herm\xe8s : MB ~70%, EBIT ~40%, RN ~30%.
Bilan : Actif = Passif + CP. Flux de tr\xe9sorerie : Exploitation, Investissement, Financement.
R\xe8gle d'or : R\xe9sultat net \u{2260} Cash flow.`,en:`Income Statement: Revenue \u{2192} COGS \u{2192} Gross Profit \u{2192} OpEx \u{2192} EBIT \u{2192} Net Income. Herm\xe8s: GM ~70%, EBIT ~40%, NI ~30%.
Balance Sheet: Assets = Liabilities + Equity. Cash Flow: Operating, Investing, Financing.
Golden rule: Net income \u{2260} Cash flow.`},quiz:{q:{fr:"Hermès : 70% MB, 40% EBIT. L'écart de 30 points représente ?",en:"Hermès: 70% GM, 40% EBIT. The 30pt gap represents?"},opts:{fr:["Inefficacité","OpEx (boutiques, artisans, marketing) — mais 40% EBIT reste exceptionnel","COGS trop élevé","Réduire les coûts"],en:["Inefficiency","OpEx (boutiques, artisans, marketing) — but 40% EBIT is extraordinary","COGS too high","Cut costs"]},correct:1,explanation:{fr:"40% EBIT vs LVMH ~26%, Kering ~25%. Pricing power + zéro discount + intégration verticale.",en:"40% EBIT vs LVMH ~26%, Kering ~25%. Pricing power + zero discounting + vertical integration."}},videos:[]}]},{id:"finance",icon:"💰",color:"#A23B72",term:1,title:{en:"Applied Managerial Finance",fr:"Finance Managériale"},lessons:[{title:{en:"TVM & DCF Valuation",fr:"Valeur Temps & Évaluation DCF"},content:{fr:`VA = VF/(1+r)^n. VAN = \u{3A3} flux actualis\xe9s - Investissement. TRI = taux o\xf9 VAN = 0.
DCF : FCF 5-10 ans \u{2192} VT = FCF\xd7(1+g)/(CMPC-g) \u{2192} Actualiser au CMPC.
Herm\xe8s : EV/EBITDA ~35-40\xd7 vs luxe ~15-20\xd7.`,en:`PV = FV/(1+r)^n. NPV = \u{3A3} discounted flows - Investment. IRR = rate where NPV = 0.
DCF: FCF 5-10 yrs \u{2192} TV = FCF\xd7(1+g)/(WACC-g) \u{2192} Discount at WACC.
Herm\xe8s: EV/EBITDA ~35-40\xd7 vs luxury ~15-20\xd7.`},quiz:{q:{fr:"FCF 3Mds€, g=3%, CMPC=7%. Valeur terminale ?",en:"FCF €3B, g=3%, WACC=7%. Terminal value?"},opts:{fr:["42,9 Mds€","75 Mds€","77,25 Mds€","100 Mds€"],en:["€42.9B","€75B","€77.25B","€100B"]},correct:2,explanation:{fr:"VT = 3×1,03/0,04 = 77,25 Mds€. Si g=4%, VT = 104 Mds€. Sensibilité extrême.",en:"TV = 3×1.03/0.04 = €77.25B. If g=4%, TV = €104B. Extreme sensitivity."}},videos:[]}]},{id:"excel",icon:"📊",color:"#217346",term:3,title:{en:"Advanced Excel for Finance",fr:"Excel Avancé Finance"},lessons:[{title:{fr:"INDEX/EQUIV & RECHERCHEX",en:"INDEX/MATCH & XLOOKUP"},content:{fr:`INDEX/EQUIV remplace RECHERCHEV \u{2014} bidirectionnel et incassable.
=INDEX(plage_retour; EQUIV(valeur; plage_rech; 0))
RECHERCHEX (365) : =RECHERCHEX(valeur; rech; retour; [absent])
Pourquoi pas RECHERCHEV ? Ne cherche qu'\xe0 droite, casse si colonne ins\xe9r\xe9e, plus lent.`,en:`INDEX/MATCH replaces VLOOKUP \u{2014} bidirectional and stable.
=INDEX(return_range, MATCH(value, lookup_range, 0))
XLOOKUP (365): =XLOOKUP(value, lookup, return, [not_found])
Why not VLOOKUP? Only looks right, breaks on column insert, slower.`},quiz:{q:{fr:"Site en col A, coûts col D. Récupérer le coût du site ABR ?",en:"Site in col A, costs col D. Retrieve cost for site ABR?"},opts:{fr:["RECHERCHEV","INDEX/EQUIV","Les deux identiques","SOMME.SI"],en:["VLOOKUP","INDEX/MATCH","Both identical","SUMIF"]},correct:1,explanation:{fr:"INDEX/EQUIV est professionnel, stable, bidirectionnel. RECHERCHEV casse si colonne insérée.",en:"INDEX/MATCH is professional, stable, bidirectional. VLOOKUP breaks on column insert."}},videos:[]},{title:{fr:"SOMME.SI.ENS & Tableaux Croisés Dynamiques",en:"SUMIFS & Pivot Tables"},content:{fr:`SOMME.SI.ENS : la formule CDG par excellence.
=SOMME.SI.ENS(somme; plage1; crit\xe8re1; plage2; crit\xe8re2...)
TCD : Lignes=Sites, Colonnes=Mois, Valeurs=Co\xfbt, Filtre=Produit.
Power Query : Connecteur dossier \u{2192} empiler 4 fichiers sites \u{2192} nettoyer \u{2192} TCD.`,en:`SUMIFS: the CDG workhorse formula.
=SUMIFS(sum_range, criteria1_range, criteria1, criteria2_range, criteria2...)
Pivot Tables: Rows=Sites, Columns=Months, Values=Cost, Filter=Product.
Power Query: Folder connector \u{2192} append 4 site files \u{2192} clean \u{2192} pivot.`},quiz:{q:{fr:"Consolider 4 fichiers Excel mensuels de 4 sites. Meilleure approche ?",en:"Consolidate 4 monthly Excel files from 4 sites. Best approach?"},opts:{fr:["Copier-coller","Power Query connecteur dossier","VBA","RECHERCHEV entre fichiers"],en:["Copy-paste","Power Query folder connector","VBA","VLOOKUP between files"]},correct:1,explanation:{fr:"Power Query : un dossier, une connexion, actualisation en un clic. Scalable et maintenable.",en:"Power Query: one folder, one connection, one-click refresh. Scalable and maintainable."}},videos:[]}]},{id:"powerbi",icon:"📈",color:"#F2C811",term:3,title:{en:"Power BI & Dashboards",fr:"Power BI & Tableaux de Bord"},lessons:[{title:{fr:"Schéma étoile & DAX essentiel",en:"Star Schema & Essential DAX"},content:{fr:`SCH\xc9MA \xc9TOILE : FactProduction au centre + DimDate, DimSite, DimProduit autour. Relations 1:N de dimension vers fait.
DAX : % Total = DIVIDE([CA], CALCULATE([CA], ALL(DimSite))). YTD = TOTALYTD([CA], DimDate[Date]). N-1 = CALCULATE([CA], SAMEPERIODLASTYEAR(DimDate[Date])).`,en:`STAR SCHEMA: FactProduction at centre + DimDate, DimSite, DimProduct around it. 1:many from dimension to fact.
DAX: % Total = DIVIDE([Rev], CALCULATE([Rev], ALL(DimSite))). YTD = TOTALYTD([Rev], DimDate[Date]).`},quiz:{q:{fr:"Pourquoi une table unique aplatie est problématique en Power BI ?",en:"Why is a single flat table problematic in Power BI?"},opts:{fr:["Aucun problème","Lent, pas de drill-through, time intelligence cassée","Power BI gère auto","Ajouter de la RAM"],en:["No problem","Slow, no drill-through, broken time intelligence","PBI handles it","Add RAM"]},correct:1,explanation:{fr:"Le schéma étoile est requis pour la performance et le fonctionnement de DAX time intelligence.",en:"Star schema required for performance and DAX time intelligence to work correctly."}},videos:[]}]},{id:"writing",icon:"✍️",color:"#5C6BC0",term:4,title:{en:"Professional Writing",fr:"Écriture Professionnelle"},lessons:[{title:{fr:"Architecture d'un paragraphe",en:"Paragraph Architecture"},content:{fr:`Structure TEAL : Th\xe8se (conclusion en premier) \u{2192} Evidence (donn\xe9es chiffr\xe9es) \u{2192} Analyse (interpr\xe9tation) \u{2192} Lien (transition).

Rules: Lead with conclusion. Specific numbers (not "increased significantly" but "+12.3%"). Active voice. Max 4 sentences per paragraph.`},quiz:{q:{fr:"Première phrase d'un paragraphe d'analyse financière ?",en:"First sentence of a financial analysis paragraph?"},opts:{fr:["Description du contexte","La conclusion/recommandation","Données brutes","Question rhétorique"],en:["Context description","The conclusion/recommendation","Raw data","Rhetorical question"]},correct:1,explanation:{fr:"En écriture professionnelle, on commence TOUJOURS par la conclusion. Le lecteur décide en 5 secondes s'il continue.",en:"In professional writing, ALWAYS lead with the conclusion. The reader decides in 5 seconds whether to continue."}},videos:[]}]}],g={finance:{id:"finance",name:"Professor Ledger",sub:"Costing, Distribution & P&L",icon:"🎓",color:"#F2C811",welcome:{en:"I'm **Professor Ledger** — your AI Finance Teacher.\n\nI specialise in **Costing**, **Distribution** (Hermès' unique model), and **P&L analysis**.\n\nI know the Hermès business model intimately. Ask me anything.",fr:"Je suis **Professeur Ledger** — votre tuteur IA Finance.\n\nJe me spécialise dans le **Costing**, la **Distribution** (modèle Hermès), et l'**analyse du CdR**.\n\nDemandez-moi n'importe quoi."},system:"You are Professor Ledger — elite AI Finance Teacher for Management Accounting, Costing, Distribution, P&L. Teaching CDG alternant at Hermès les Abrets. COVER: Cost behaviour, absorption/marginal/ABC/standard costing, variance analysis (material price/usage, labour rate/efficiency). Hermès: 300+ DOS, Podium, zero discounting, Bobigny. FY2024 €15.2B rev, ~70% GM, ~40% EBIT, ~30% net. Quality reject ~16%, one artisan per bag (15-48hrs), transfer pricing cost+margin. Be direct, use French terms alongside English. Formula + worked example + Hermès context. Max 200 words unless deep dive.",topics:[{label:"🧮 Costing Methods",prompt:"Explain the 4 costing methods and when to use each at Hermès"},{label:"📉 Variance Anal
